name: Soft Design 17 - Welcome screen

# Uploading this file applies the change by itself. Afterwards run: Build APK.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/soft-design-17-welcome-screen.yml'

permissions:
  contents: write

concurrency:
  group: soft-design
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Already applied?
        id: check
        run: |
          if [ -f .softgram/17-welcome-screen.done ]; then echo 'done=true' >> "$GITHUB_OUTPUT"; echo 'Already applied.'; else echo 'done=false' >> "$GITHUB_OUTPUT"; fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.check.outputs.done != 'true'
        with:
          bun-version-file: package.json

      - name: Install tooling
        if: steps.check.outputs.done != 'true'
        run: |
          git config --global user.email ci@softgram
          git config --global user.name 'softgram ci'
          bun install --frozen-lockfile

      - name: Build the patched source tree (stock Telegram plus every patch)
        if: steps.check.outputs.done != 'true'
        run: |
          bun run setup -- --ci --pluginless --no-submodules
          git -C worktree-pluginless write-tree > /tmp/welcome-base-tree
          cat /tmp/welcome-base-tree

      - name: Write the shapes and the Kotlin view
