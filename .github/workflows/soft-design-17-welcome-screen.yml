          package desu.inugram.ui

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.TextView
          import org.telegram.messenger.AndroidUtilities
          import org.telegram.messenger.LocaleController
          import org.telegram.messenger.R
          import org.telegram.ui.ActionBar.Theme
          import kotlin.math.cos
          import kotlin.math.sin

          // softgram: welcome screen with three spring-driven 3D shapes, laid over the stock intro
          object SoftWelcome {
              private const val TAG = "softgram_welcome"

              @JvmStatic
              fun install(context: Context, container: View?, button: View?) {
                  val group = container as? ViewGroup ?: return
                  if (group.findViewWithTag<View>(TAG) != null) return
                  val view = SoftWelcomeView(context, group, button)
                  view.tag = TAG
                  group.addView(view, 0, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  view.hideStock()
              }
          }

          class SoftWelcomeView(context: Context, private val host: ViewGroup, private val button: View?) : FrameLayout(context) {
              private class Spring(var target: Float = 0f) {
                  var value = 0f
                  var velocity = 0f

                  fun step(dt: Float, stiffness: Float, damping: Float) {
                      val accel = -stiffness * (value - target) - damping * velocity
                      velocity += accel * dt
                      value += velocity * dt
                  }
              }

              private class Shape(
                  val res: Int,
                  val left: Float,
                  val top: Float,
                  val width: Float,
                  val originX: Float,
                  val originY: Float,
                  val delay: Float,
                  val period: Float,
                  val lift: Boolean,
              ) {
                  var bitmap: Bitmap? = null
                  val enter = Spring(0f)
                  val tap = Spring(0f)
                  val box = RectF()
              }

              private val shapes = listOf(
                  Shape(R.drawable.softgram_welcome_torus, 0.4088f, 0f, 0.5912f, 0f, 1f, 0.05f, 9f, true),
                  Shape(R.drawable.softgram_welcome_loop, 0f, 0.1489f, 0.465f, 1f, 0.5f, 0.2f, 11f, false),
                  Shape(R.drawable.softgram_welcome_capsule, 0.5621f, 0.2051f, 0.4379f, 0f, 0.5f, 0.35f, 8f, false),
              )
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val dst = RectF()
              private val liftFilter = ColorMatrixColorFilter(
                  ColorMatrix(
                      floatArrayOf(
                          1.5f, 0f, 0f, 0f, 48f,
                          0f, 1.5f, 0f, 0f, 48f,
                          0f, 0f, 1.5f, 0f, 48f,
                          0f, 0f, 0f, 1f, 0f,
                      )
                  )
              )
              private val calm = Settings.Global.getFloat(context.contentResolver, Settings.Global.ANIMATOR_DURATION_SCALE, 1f) == 0f
              private var startTime = 0L
              private var lastTime = 0L
              private var bgColor = 0
              private var dark = false

              private val align = if (LocaleController.isRTL) Gravity.RIGHT else Gravity.LEFT

              private val title = TextView(context).apply {
                  text = LocaleController.getString(R.string.InuWelcomeTitle)
                  textSize = 34f
                  typeface = Typeface.create("sans-serif", Typeface.BOLD)
                  setLineSpacing(0f, 1.04f)
                  letterSpacing = -0.03f
                  gravity = align
              }

              private val subtitle = TextView(context).apply {
                  text = LocaleController.getString(R.string.InuWelcomeSubtitle)
                  textSize = 16f
                  gravity = align
              }

              init {
                  setWillNotDraw(false)
                  shapes.forEach { it.bitmap = decode(it.res) }
                  addView(title, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT))
                  addView(subtitle, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT))
                  button?.addOnLayoutChangeListener { _, _, top, _, _, _, oldTop, _, _ ->
                      if (top != oldTop) post { requestLayout() }
                  }
                  syncTheme()
              }

              private fun decode(res: Int): Bitmap? = try {
                  BitmapFactory.decodeResource(resources, res, BitmapFactory.Options().apply { inScaled = false })
              } catch (_: Throwable) {
                  null
              }

              fun hideStock() {
                  for (i in 0 until host.childCount) {
                      val child = host.getChildAt(i)
                      if (child === this || child === button || child is TextView) continue
                      if (child.visibility != View.GONE) child.visibility = View.GONE
                  }
              }

              private fun syncTheme() {
                  val bg = Theme.getColor(Theme.key_windowBackgroundWhite)
                  val isDark = Theme.isCurrentThemeDark()
                  if (bg == bgColor && isDark == dark) return
                  bgColor = bg
                  dark = isDark
                  title.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText))
                  subtitle.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText2))
                  (button as? TextView)?.let {
                      it.background = GradientDrawable().apply {
                          cornerRadius = AndroidUtilities.dp(30f).toFloat()
                          setColor(if (isDark) 0xFFFFFFFF.toInt() else 0xFF000000.toInt())
                      }
                      it.setTextColor(if (isDark) 0xFF000000.toInt() else 0xFFFFFFFF.toInt())
                  }
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  super.onLayout(changed, l, t, r, b)
                  val w = r - l
                  val h = b - t
                  val side = AndroidUtilities.dp(26f)
                  val buttonTop = button?.takeIf { it.top > 0 }?.top ?: (h - AndroidUtilities.dp(132f))
                  val spec = View.MeasureSpec.makeMeasureSpec(w - 2 * side, View.MeasureSpec.EXACTLY)
                  val free = View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED)
                  subtitle.measure(spec, free)
                  title.measure(spec, free)
                  val subBottom = buttonTop - AndroidUtilities.dp(30f)
                  val subTop = subBottom - subtitle.measuredHeight
                  subtitle.layout(side, subTop, w - side, subBottom)
                  val titleBottom = subTop - AndroidUtilities.dp(14f)
                  title.layout(side, titleBottom - title.measuredHeight, w - side, titleBottom)
              }

              private fun advance(dt: Float, age: Float) {
                  var left = dt
                  while (left > 0f) {
                      val h = minOf(left, 1f / 120f)
                      for (s in shapes) {
                          if (age >= s.delay) s.enter.target = 1f
                          s.enter.step(h, 120f, 9.5f)
                          s.tap.step(h, 260f, 8f)
                      }
                      left -= h
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  if (startTime == 0L) {
                      startTime = now
                      lastTime = now
                  }
                  val dt = ((now - lastTime) / 1000f).coerceAtMost(0.05f)
                  lastTime = now
                  val age = (now - startTime) / 1000f
                  syncTheme()
                  hideStock()
                  if (calm) {
                      for (s in shapes) {
                          s.enter.value = 1f
                          s.enter.target = 1f
                      }
                  } else {
                      advance(dt, age)
                  }
                  canvas.drawColor(bgColor)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  shapes.forEachIndexed { i, s -> drawShape(canvas, s, i, w, h, age) }
                  postInvalidateOnAnimation()
              }

              private fun drawShape(canvas: Canvas, s: Shape, index: Int, w: Float, h: Float, age: Float) {
                  val bmp = s.bitmap ?: return
                  val sw = w * s.width
                  val sh = sw * bmp.height / bmp.width
                  val x0 = w * s.left
                  val y0 = h * s.top
                  s.box.set(x0, y0, x0 + sw, y0 + sh)
                  val e = s.enter.value
                  val phase = age * 6.2831855f / s.period + index * 1.7f
                  val floatX = if (calm) 0f else sin(phase) * AndroidUtilities.dp(5f)
                  val floatY = if (calm) 0f else cos(phase * 0.8f + index) * AndroidUtilities.dp(7f)
                  val floatR = if (calm) 0f else sin(phase * 0.7f) * 3f
                  val scale = (0.55f + 0.45f * e).coerceAtLeast(0.01f)
                  val squash = s.tap.value
                  paint.alpha = (255f * e.coerceIn(0f, 1f)).toInt()
                  paint.colorFilter = if (dark && s.lift) liftFilter else null
                  canvas.save()
                  canvas.translate(x0 + sw / 2f + floatX, y0 + sh / 2f + floatY - (1f - e) * AndroidUtilities.dp(220f))
                  canvas.rotate(floatR - (1f - e) * 35f)
                  canvas.scale(scale * (1f + squash), scale * (1f - squash * 0.6f))
                  canvas.translate(-sw / 2f, -sh / 2f)
                  canvas.scale(1.1f, 1.1f, sw * s.originX, sh * s.originY)
                  dst.set(0f, 0f, sw, sh)
                  canvas.drawBitmap(bmp, null, dst, paint)
                  canvas.restore()
              }

              private fun hit(s: Shape, x: Float, y: Float): Boolean {
                  val bmp = s.bitmap ?: return false
                  if (!s.box.contains(x, y)) return false
                  val px = ((x - s.box.left) / s.box.width() * bmp.width).toInt().coerceIn(0, bmp.width - 1)
                  val py = ((y - s.box.top) / s.box.height() * bmp.height).toInt().coerceIn(0, bmp.height - 1)
                  return (bmp.getPixel(px, py) ushr 24) > 40
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (event.actionMasked != MotionEvent.ACTION_DOWN) return true
                  val index = shapes.indexOfFirst { hit(it, event.x, event.y) }
                  if (index < 0) return false
                  shapes.forEachIndexed { i, s -> s.tap.velocity += if (i == index) 2.8f else 0.7f }
                  return true
              }
          }
          KTEOF

      - name: Apply the welcome screen
        if: steps.check.outputs.done != 'true'
        run: |
          cat > /tmp/apply_welcome.py <<'PYEOF'
          import os, re, sys

          WT = os.environ.get("SG_WT", "worktree-pluginless")
          SRC = "/tmp/welcome-src"

          def rd(p):
              with open(p, encoding="utf-8", newline="") as f:
                  return f.read()

          def wr(p, s):
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(s)

          def die(msg):
              print("ERROR: " + msg)
              sys.exit(1)

          def jpath(name):
              hits = []
              for d, _, files in os.walk(os.path.join(WT, "TMessagesProj/src/main/java")):
                  if name in files:
                      hits.append(os.path.join(d, name))
              if len(hits) != 1:
                  die("%s: found %d files in worktree" % (name, len(hits)))
              return hits[0]

          def show(s, needle, label):
              print("--- diagnostics for %s (lines containing %r)" % (label, needle))
              for i, line in enumerate(s.split("\n")):
                  if needle in line:
                      print("%6d: %s" % (i + 1, line.rstrip()))

          def method_end(s, start):
              depth, i, n = 1, start, len(s)
              while i < n and depth > 0:
                  c = s[i]
                  if s.startswith("//", i):
                      j = s.find("\n", i)
                      i = n if j < 0 else j
                      continue
                  if s.startswith("/*", i):
                      j = s.find("*/", i + 2)
                      i = n if j < 0 else j + 2
                      continue
                  if c == '"' or c == "'":
                      q = c
                      i += 1
                      while i < n and s[i] != q:
                          i += 2 if s[i] == "\\" else 1
                      i += 1
                      continue
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                  i += 1
              return i if depth == 0 else -1

          if not os.path.isdir("src/res") or not os.path.isfile("series"):
              die("run from the repository root")
          if not os.path.isdir(WT):
              die("worktree %s missing (setup did not run)" % WT)

          # ---------------------------------------------------------------- shapes (webp with alpha) and kotlin view
          import base64
          os.makedirs("src/res/drawable-xxhdpi", exist_ok=True)
          for key in ("torus", "loop", "capsule"):
              data = base64.b64decode("".join(rd("%s/%s.b64" % (SRC, key)).split()))
              if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  die("shape %s is not a webp" % key)
              with open("src/res/drawable-xxhdpi/softgram_welcome_%s.webp" % key, "wb") as f:
                  f.write(data)
          os.makedirs("src/fork/ui", exist_ok=True)
          wr("src/fork/ui/SoftWelcome.kt", rd(SRC + "/SoftWelcome.kt"))

          # ---------------------------------------------------------------- strings
          STR = {
              "values": ("It's easy talking to your friends with Softgram", "Chat and call your friends, simply and quickly."),
              "values-fa": ("گفتگو با دوستانت با Softgram آسان است", "ساده و سریع با دوستانت چت کن و تماس بگیر."),
          }
          for d, (t, sub) in STR.items():
              p = "src/res/%s/strings_inu.xml" % d
              if not os.path.isfile(p):
                  print("skip " + p)
                  continue
              s = rd(p)
              if "InuWelcomeTitle" in s:
                  continue
              add = '    <string name="InuWelcomeTitle">%s</string>\n    <string name="InuWelcomeSubtitle">%s</string>\n' % (t.replace("'", "\\'"), sub.replace("'", "\\'"))
              if s.count("</resources>") != 1:
                  die(p + ": </resources> not found once")
              wr(p, s.replace("</resources>", add + "</resources>"))

          # ---------------------------------------------------------------- feature list
          p = "FEATURES.md"
          s = rd(p)
          if "**welcome screen**" not in s:
              m = re.search(r"^- \*\*softgram academics\*\*.*\n", s, re.M)
              line = ("- **welcome screen** — the first screen is white with three soft 3D shapes (black ring, blue loop, magenta capsule) that float on springs and bounce when tapped; "
                      "headline and subtitle under them and the Start Messaging pill at the bottom; follows the light and dark theme\n")
              if m:
                  wr(p, s[:m.end()] + line + s[m.end():])
              else:
                  print("WARNING: FEATURES.md anchor missing, entry skipped")

          # ---------------------------------------------------------------- stock hook (worktree)
          p = jpath("IntroActivity.java")
          s = rd(p)
          if "SoftWelcome" not in s:
              for field in ("frameContainerView", "startMessagingButton"):
                  if not re.search(r"^[ \t]*(?:(?:private|public|protected|final)[ \t]+)*[\w.<>\[\]]+[ \t]+%s[ \t]*(?:=[^;]*)?;" % field, s, re.M):
                      show(s, field, "IntroActivity")
                      die("IntroActivity: field %s not declared" % field)
              sig = list(re.finditer(r"^[ \t]*public View createView\(Context context\) \{\n", s, re.M))
              if len(sig) != 1:
                  show(s, "createView", "IntroActivity")
                  die("IntroActivity: createView found %d times" % len(sig))
              start = sig[0].end()
              end = method_end(s, start)
              if end < 0:
                  die("IntroActivity: could not find the end of createView")
              body = s[start:end]
              rets = list(re.finditer(r"^([ \t]*)return (\w+);[ \t]*\n", body, re.M))
              if not rets:
                  print("--- tail of createView")
                  print(body[-1500:])
                  die("IntroActivity: no top-level return in createView")
              r = rets[-1]
              hook = "%sdesu.inugram.ui.SoftWelcome.install(context, frameContainerView, startMessagingButton);\n" % r.group(1)
              pos = start + r.start()
              s = s[:pos] + hook + s[pos:]
              wr(p, s)
              print("hooked before: " + r.group(0).strip())

          os.makedirs(".softgram", exist_ok=True)
          wr(".softgram/17-welcome-screen.done", "welcome screen applied\n")
          print("OK: welcome screen applied")
          PYEOF
          python3 /tmp/apply_welcome.py

      - name: Export the stock hook as a patch
        if: steps.check.outputs.done != 'true'
        run: |
          cat > /tmp/export_welcome.py <<'PYEOF'
          import os, re, subprocess, sys, tempfile

          WT = "worktree-pluginless"
          def run(*a, env=None, check=True, cwd=None):
              e = dict(os.environ)
              if env: e.update(env)
              r = subprocess.run(a, cwd=cwd or WT, env=e, capture_output=True, text=True)
              if check and r.returncode != 0:
                  print(r.stdout + r.stderr)
                  sys.exit("command failed: " + " ".join(a))
              return r.stdout.strip()

          ident = {"GIT_AUTHOR_NAME": "softgram ci", "GIT_AUTHOR_EMAIL": "ci@softgram",
                   "GIT_COMMITTER_NAME": "softgram ci", "GIT_COMMITTER_EMAIL": "ci@softgram"}
          base_tree = open("/tmp/welcome-base-tree").read().strip()
          run("git", "add", "-u")
          new_tree = run("git", "write-tree")
          if new_tree == base_tree:
              sys.exit("no stock changes were produced")
          head = run("git", "rev-parse", "HEAD")
          base = run("git", "commit-tree", base_tree, "-p", head, "-m", "base", env=ident)
          msg = "Welcome screen: spring-driven 3D shapes over the stock intro."
          new = run("git", "commit-tree", new_tree, "-p", base, "-m", msg, env=ident)
          out = tempfile.mkdtemp()
          run("git", "format-patch", "--ignore-submodules=none", "--zero-commit", "--no-signature", "--subject-prefix=", "-1", new, "-o", out)
          name = os.listdir(out)[0]
          text = open(os.path.join(out, name), encoding="utf-8").read()
          blocks = re.split(r"(?=^diff --git )", text, flags=re.M)
          clean = "".join(b if "\nGIT binary patch" in b else re.sub(r"^index [0-9a-f]+\.\.[0-9a-f]+( \d+)?$", r"index 0000000..0000000\1", b, count=1, flags=re.M) for b in blocks)
          if clean.count("diff --git") != 1 or "IntroActivity.java" not in clean:
              print(clean)
              sys.exit("unexpected patch content")
          os.makedirs("patches/softgram", exist_ok=True)
          target = "patches/softgram/welcome-screen.patch"
          with open(target, "w", encoding="utf-8", newline="") as f:
              f.write(clean)
          idx = "/tmp/welcome-check-index"
          if os.path.exists(idx): os.remove(idx)
          chk = {"GIT_INDEX_FILE": idx}
          run("git", "read-tree", base_tree, env=chk)
          run("git", "apply", "--cached", "--check", os.path.abspath(target), env=chk)
          series = [l for l in open("series", encoding="utf-8").read().split("\n") if l.strip()]
          if "softgram/welcome-screen.patch" not in series:
              series.append("softgram/welcome-screen.patch")
          open("series", "w", encoding="utf-8").write("\n".join(series) + "\n")
          print("OK: exported " + target)
          PYEOF
          python3 /tmp/export_welcome.py
          grep '^diff --git' patches/softgram/welcome-screen.patch
          grep '^+' patches/softgram/welcome-screen.patch

      - name: Sanity check
        if: steps.check.outputs.done != 'true'
        run: |
          for f in src/fork/ui/SoftWelcome.kt src/res/drawable-xxhdpi/softgram_welcome_torus.webp src/res/drawable-xxhdpi/softgram_welcome_loop.webp src/res/drawable-xxhdpi/softgram_welcome_capsule.webp patches/softgram/welcome-screen.patch; do
            [ -s "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          grep -q '^softgram/welcome-screen.patch$' series || { echo "::error::series entry missing"; exit 1; }
          grep -q 'InuWelcomeTitle' src/res/values/strings_inu.xml || { echo "::error::strings missing"; exit 1; }
          grep -q 'SoftWelcome.install' patches/softgram/welcome-screen.patch || { echo "::error::hook missing"; exit 1; }
          echo 'verified'

      - name: Translation check (informational)
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        run: bun run check-translations fa ru uk ar es it tr ja zh-rCN

      - name: Commit and push
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name  'softgram ci'
          git config user.email 'ci@softgram'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to change (already applied).'
            exit 0
          fi
          git commit -q -m "Soft Design 17: welcome screen with spring-driven 3D shapes"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Pushed. Now run: Build APK'
