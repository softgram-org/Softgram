name: Soft Design 21 - Reminders from messages

# Needs Soft Design 20 applied first. Uploading this file applies the change by itself. Afterwards run: Build APK.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/soft-design-21-reminders.yml'

permissions:
  contents: write

concurrency:
  group: soft-design
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Soft Design 21
        run: |
          cat > /tmp/step.py <<'PYEOF'
          import os, sys

          def rd(p):
              with open(p, encoding="utf-8", newline="") as f:
                  return f.read()

          def wr(p, s):
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(s)

          def sub(path, old, new):
              s = rd(path)
              c = s.count(old)
              if c != 1:
                  sys.exit("::error::anchor found %d times in %s: %s" % (c, path, old[:100]))
              wr(path, s.replace(old, new))

          def after_line(path, needle, text):
              lines = rd(path).split("\n")
              hits = [i for i, l in enumerate(lines) if needle in l]
              if len(hits) != 1:
                  sys.exit("::error::line anchor found %d times in %s: %s" % (len(hits), path, needle))
              lines.insert(hits[0] + 1, text)
              wr(path, "\n".join(lines))

          MARK = ".softgram/21-reminders.done"
          if os.path.exists(MARK):
              print("Already applied.")
              sys.exit(0)

          # 1. stock patches: the note field in Telegram's schedule picker, and the alarm receivers in the manifest
          ALERTS = r'''diff --git a/TMessagesProj/src/main/java/org/telegram/ui/Components/AlertsCreator.java b/TMessagesProj/src/main/java/org/telegram/ui/Components/AlertsCreator.java
          index b20f86e..3e5d4f1 100644
          --- a/TMessagesProj/src/main/java/org/telegram/ui/Components/AlertsCreator.java
          +++ b/TMessagesProj/src/main/java/org/telegram/ui/Components/AlertsCreator.java
          @@ -4308,4 +4308,7 @@ public class AlertsCreator {
               }
           
          +    // softgram: an extra view (the reminder note) shown under the title of the schedule picker
          +    public static View inu_extraView;
          +
               public static class ScheduleDatePickerColors {
           
          @@ -4403,5 +4406,5 @@ public class AlertsCreator {
                   long selfUserId = UserConfig.getInstance(UserConfig.selectedAccount).getClientUserId();
           
          -        BottomSheet.Builder builder = new BottomSheet.Builder(context, false, resourcesProvider);
          +        BottomSheet.Builder builder = new BottomSheet.Builder(context, inu_extraView != null, resourcesProvider);
                   builder.setApplyBottomPadding(false);
           
          @@ -4491,4 +4494,9 @@ public class AlertsCreator {
                   titleView.setOnTouchListener((v, event) -> true);
           
          +        if (inu_extraView != null) {
          +            container.addView(inu_extraView, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, LayoutHelper.WRAP_CONTENT, 22, 2, 22, 6));
          +            inu_extraView = null;
          +        }
          +
                   final boolean[] notify = new boolean[] { true };
                   ActionBarMenuItem optionsButton = null;
          '''
          MANIFEST = r'''diff --git a/TMessagesProj/src/main/AndroidManifest.xml b/TMessagesProj/src/main/AndroidManifest.xml
          index 172ced1..27d5af7 100644
          --- a/TMessagesProj/src/main/AndroidManifest.xml
          +++ b/TMessagesProj/src/main/AndroidManifest.xml
          @@ -53,4 +53,6 @@
               <uses-permission android:name="android.permission.READ_PHONE_STATE" />
               <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          +    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
          +    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
               <uses-permission android:name="android.permission.USE_FINGERPRINT" />
               <uses-permission android:name="android.permission.USE_BIOMETRIC" />
          @@ -627,4 +629,10 @@
           
                   <receiver android:name=".NotificationDismissReceiver" android:exported="false"/>
          +        <receiver android:name="desu.inugram.helpers.academics.ReminderReceiver" android:exported="false"/>
          +        <receiver android:name="desu.inugram.helpers.academics.ReminderBootReceiver" android:exported="true">
          +            <intent-filter>
          +                <action android:name="android.intent.action.BOOT_COMPLETED" />
          +            </intent-filter>
          +        </receiver>
           
                   <receiver android:name="desu.inugram.helpers.update.ApkInstaller$UpdateReceiver" android:exported="false">
          '''
          wr("patches/softgram/reminder-picker.patch", ALERTS.lstrip("\n"))
          wr("patches/softgram/reminder-manifest.patch", MANIFEST.lstrip("\n"))
          series = rd("series")
          if not series.endswith("\n"):
              series += "\n"
          for name in ("softgram/reminder-picker.patch", "softgram/reminder-manifest.patch"):
              if name not in series.split("\n"):
                  series += name + "\n"
          wr("series", series)

          # 2. resources: the notification layout and its filled icons (layouts need their own sync line, drawables already have one)
          sub("assets/scripts/config.ts", "  res('drawable/*.xml', 'drawable'),\n",
              "  res('drawable/*.xml', 'drawable'),\n  res('layout/*.xml', 'layout'),\n")
          def vec(name, body):
              wr("src/res/drawable/%s.xml" % name,
                 '<?xml version="1.0" encoding="utf-8"?>\n'
                 '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
                 '    android:width="24dp"\n'
                 '    android:height="24dp"\n'
                 '    android:viewportWidth="24"\n'
                 '    android:viewportHeight="24">\n' + body + '</vector>\n')

          vec("softgram_reminder_bell",
              '    <path\n'
              '        android:fillColor="#FFFFFF"\n'
              '        android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z" />\n')
          vec("softgram_reminder_close",
              '    <path\n'
              '        android:fillColor="#FFFFFF"\n'
              '        android:pathData="M6.4,5l-1.4,1.4L10.6,12L5,17.6L6.4,19L12,13.4L17.6,19L19,17.6L13.4,12L19,6.4L17.6,5L12,10.6z" />\n')
          wr("src/res/drawable/softgram_reminder_btn_bg.xml",
             '<?xml version="1.0" encoding="utf-8"?>\n'
             '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">\n'
             '    <solid android:color="#B3606A7A" />\n'
             '    <stroke android:width="0.75dp" android:color="#4DFFFFFF" />\n'
             '</shape>\n')
          wr("src/res/drawable/softgram_reminder_bell_bg.xml",
             '<?xml version="1.0" encoding="utf-8"?>\n'
             '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">\n'
             '    <gradient android:angle="270" android:startColor="#4FA3F7" android:endColor="#2F7FD6" />\n'
             '</shape>\n')
          wr("src/res/layout/softgram_reminder_notification.xml",
             '<?xml version="1.0" encoding="utf-8"?>\n'
             '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n'
             '    android:layout_width="match_parent"\n'
             '    android:layout_height="wrap_content"\n'
             '    android:gravity="center_vertical"\n'
             '    android:orientation="horizontal">\n\n'
             '    <FrameLayout\n'
             '        android:layout_width="40dp"\n'
             '        android:layout_height="40dp"\n'
             '        android:background="@drawable/softgram_reminder_bell_bg">\n\n'
             '        <ImageView\n'
             '            android:layout_width="22dp"\n'
             '            android:layout_height="22dp"\n'
             '            android:layout_gravity="center"\n'
             '            android:importantForAccessibility="no"\n'
