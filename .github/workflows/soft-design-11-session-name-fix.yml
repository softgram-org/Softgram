name: Soft Design 11 - Session name fix

# Uploading this file applies the change by itself. Afterwards run: Build APK.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/soft-design-11-session-name-fix.yml'

permissions:
  contents: write

concurrency:
  group: soft-design
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Soft Design 11
        run: |
          cat > /tmp/step.py <<'PYEOF'
          import os, sys

          def rd(p):
              with open(p, encoding="utf-8", newline="") as f:
                  return f.read()

          def wr(p, s):
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(s)

          def die(m):
              print("ERROR: " + m)
              sys.exit(1)

          if not os.path.isdir("src/res") or not os.path.isfile("series"):
              die("run from the repository root")

          P = "src/fork/helpers/security/ParanoiaHelper.kt"
          s = rd(P)
          if "LEGACY_APP_NAMES" not in s:
              old = """    fun getSessionAppName(serverName: String): String {
                  if (!InuConfig.MASK_SERVER_APP_NAME.value) return serverName
          """
              new = """    fun getSessionAppName(serverName: String): String {
                  if (LEGACY_APP_NAMES.containsMatchIn(serverName)) {
                      return runCatching { LocaleController.getString(R.string.AppName) }.getOrElse { serverName }
                  }
                  if (!InuConfig.MASK_SERVER_APP_NAME.value) return serverName
          """
              if s.count(old) != 1:
                  die("getSessionAppName anchor not found")
              s = s.replace(old, new)
              anchor = "    // entiny: Telegram server reports client by registered api_id title; mask with AppName in session list\n"
              if s.count(anchor) != 1:
                  die("comment anchor not found")
              s = s.replace(anchor, "    // entiny: sessions created with an older api_id keep that app's title on the server, always show our own name for them\n    private val LEGACY_APP_NAMES = Regex(\"entiny|inugram\", RegexOption.IGNORE_CASE)\n\n" + anchor)
              wr(P, s)

          print("OK: session name fix applied")
          PYEOF
          python3 /tmp/step.py

      - name: Sanity check
        run: |
          grep -q 'LEGACY_APP_NAMES.containsMatchIn' src/fork/helpers/security/ParanoiaHelper.kt
          echo 'verified'

      - name: Commit and push
        run: |
          git config user.name  'softgram ci'
          git config user.email 'ci@softgram'
          git add -A -- . ':!worktree' ':!worktree-pluginless'
          if git diff --cached --quiet; then
            echo 'Nothing to change (already applied).'
            exit 0
          fi
          git commit -q -m "Soft Design 11: sessions always show the Softgram name"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Pushed. Now run: Build APK'
