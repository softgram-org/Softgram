              add_strings(loc, [
                  ("InuSpamFolder", title),
                  ("InuSpamFolderInfo", info.replace("'", "\\'")),
                  ("InuPillStackSpam", tab),
                  ("InuSpamTitle", tab),
                  ("InuSpamEmpty", empty),
