              sys.exit(1)

          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  die("%s: anchor found %d times (need 1)" % (label, n))
              return s.replace(old, new)

          def jpath(name):
              hits = []
              for d, _, files in os.walk(os.path.join(WT, "TMessagesProj/src/main/java")):
                  if name in files:
                      hits.append(os.path.join(d, name))
              if len(hits) != 1:
                  die("%s: found %d files in worktree" % (name, len(hits)))
              return hits[0]

          def show(s, needle, label):
