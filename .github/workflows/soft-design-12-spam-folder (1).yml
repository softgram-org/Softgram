              s = rd(p)
              for key, val in entries:
                  if 'name="%s"' % key in s:
                      continue
                  line = '    <string name="%s">%s</string>\n' % (key, val)
                  pos = None
                  for m in re.finditer(r'^[ \t]*<string name="(Inu\w+)"', s, re.M):
                      if m.group(1) > key:
                          pos = m.start()
                          break
                  if pos is None:
                      pos = [m for m in re.finditer(r'^[ \t]*</resources>', s, re.M)][-1].start()
                  s = s[:pos] + line + s[pos:]
              wr(p, s)

