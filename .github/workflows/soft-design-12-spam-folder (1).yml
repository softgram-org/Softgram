              ms = pat.findall(s)
              if len(ms) != 1:
                  show(s, "isLocallyIncluded", "MessagesController")
                  die("MessagesController: includesDialog anchor found %d times" % len(ms))
              def rep(m):
                  i = m.group(1)
                  return (i + "if (desu.inugram.helpers.dialogs.SpamFolderHelper.contains(accountInstance.getCurrentAccount(), dialogId)) {\n"
                          + i + "    return false;\n"
                          + i + "}\n" + m.group(0))
              s = pat.sub(rep, s, count=1)
              wr(p, s)

          p = jpath("NotificationsController.java")
          s = rd(p)
          if "SpamFolderHelper" not in s:
              pat = re.compile(r"^([ \t]*)((?:public |protected |private )?)void processNewMessages\(ArrayList<MessageObject> (\w+), boolean (\w+), boolean (\w+), CountDownLatch (\w+)\) \{\n", re.M)
              ms = pat.findall(s)
              if len(ms) != 1:
                  show(s, "processNewMessages(", "NotificationsController")
                  die("NotificationsController: processNewMessages found %d times" % len(ms))
              def rep(m):
                  i, mod, a, b, c, d = m.groups()
                  sig = "%svoid %%s(ArrayList<MessageObject> %s, boolean %s, boolean %s, CountDownLatch %s) {\n" % (mod, a, b, c, d)
                  return (i + sig % "processNewMessages"
                          + i + "    ArrayList<MessageObject> inu_kept = desu.inugram.helpers.dialogs.SpamFolderHelper.filterNotifications(currentAccount, %s);\n" % a
                          + i + "    if (inu_kept != null && inu_kept != %s && inu_kept.isEmpty()) {\n" % a
                          + i + "        if (%s != null) {\n" % d
                          + i + "            %s.countDown();\n" % d
                          + i + "        }\n"
                          + i + "        return;\n"
                          + i + "    }\n"
                          + i + "    inu_processNewMessages(inu_kept != null ? inu_kept : %s, %s, %s, %s);\n" % (a, b, c, d)
                          + i + "}\n\n"
                          + i + sig % "inu_processNewMessages")
              s = pat.sub(rep, s, count=1)
              wr(p, s)

          os.makedirs(".softgram", exist_ok=True)
          wr(".softgram/12-spam-folder.done", "spam pill applied\n")
          print("OK: spam folder applied")
          PYEOF
