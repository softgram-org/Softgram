name: Soft Design 12 - Spam pill

# Uploading this file applies the change by itself. Afterwards run: Build APK.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/soft-design-12-spam-folder.yml'

permissions:
  contents: write

concurrency:
  group: soft-design
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Already applied?
        id: check
        run: |
          if [ -f .softgram/12-spam-folder.done ]; then echo 'done=true' >> "$GITHUB_OUTPUT"; echo 'Already applied.'; else echo 'done=false' >> "$GITHUB_OUTPUT"; fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.check.outputs.done != 'true'
        with:
          bun-version-file: package.json

      - name: Install tooling
        if: steps.check.outputs.done != 'true'
        run: |
          git config --global user.email ci@softgram
          git config --global user.name 'softgram ci'
          bun install --frozen-lockfile

      - name: Build the patched source tree (stock Telegram plus every patch)
        if: steps.check.outputs.done != 'true'
        run: |
          bun run setup -- --ci --pluginless --no-submodules
          git -C worktree-pluginless write-tree > /tmp/spam-base-tree
          cat /tmp/spam-base-tree

      - name: Write Kotlin sources
        if: steps.check.outputs.done != 'true'
        run: |
          mkdir -p /tmp/spam-src
          cat > /tmp/spam-src/SpamFolderHelper.kt <<'KTEOF'
          package desu.inugram.helpers.dialogs

          import android.content.SharedPreferences
          import androidx.recyclerview.widget.RecyclerView
          import desu.inugram.InuConfig
          import desu.inugram.helpers.InuPrefs
          import org.telegram.messenger.AndroidUtilities
          import org.telegram.messenger.MessageObject
          import org.telegram.messenger.MessagesController
          import org.telegram.messenger.MessagesStorage
          import org.telegram.messenger.NotificationCenter
          import org.telegram.messenger.UserConfig
          import org.telegram.tgnet.TLRPC
          import java.util.concurrent.ConcurrentHashMap

          // entiny: strangers (not a contact, never written to) go to a virtual Spam folder; membership is local only, nothing is sent to the server
          object SpamFolderHelper {

              fun interface SelectionProbe {
                  fun active(): Boolean
              }

              private const val PREFS = "inu_spam_folder"
              private const val SEPARATOR = ","
              private const val SERVICE_NOTIFICATIONS_ID = 777000L
              private const val TALKED_LIMIT = 20000

              private class State(
                  val spam: MutableSet<Long>,
                  val released: MutableSet<Long>,
                  val talked: MutableSet<Long>,
              ) {
                  val checking: MutableSet<Long> = ConcurrentHashMap.newKeySet()
              }

              private val states = HashMap<Int, State>()

              private fun state(account: Int): State = synchronized(states) {
                  states.getOrPut(account) {
                      val prefs = InuPrefs.of(PREFS)
                      State(read(prefs, "spam_$account"), read(prefs, "released_$account"), read(prefs, "talked_$account"))
                  }
              }

              private fun read(prefs: SharedPreferences, key: String): MutableSet<Long> {
                  val set: MutableSet<Long> = ConcurrentHashMap.newKeySet()
                  val raw = prefs.getString(key, "") ?: ""
                  if (raw.isNotEmpty()) {
                      for (part in raw.split(SEPARATOR)) part.toLongOrNull()?.let { set.add(it) }
                  }
                  return set
              }

              private fun persist(account: Int, name: String, set: Set<Long>) {
                  InuPrefs.of(PREFS).edit().putString("${name}_$account", set.joinToString(SEPARATOR)).apply()
              }

              @JvmStatic
              fun isEnabled(): Boolean = InuConfig.SPAM_FOLDER.value

              @JvmStatic
              fun contains(account: Int, dialogId: Long): Boolean {
                  if (dialogId <= 0 || !isEnabled()) return false
                  if (!state(account).spam.contains(dialogId)) return false
                  val user = MessagesController.getInstance(account).getUser(dialogId)
                  return user == null || !user.contact
              }

              private fun isStranger(account: Int, userId: Long): Boolean {
                  if (userId <= 0 || userId == SERVICE_NOTIFICATIONS_ID) return false
                  if (userId == UserConfig.getInstance(account).clientUserId) return false
                  val user = MessagesController.getInstance(account).getUser(userId) ?: return false
                  return !(user.contact || user.bot || user.self || user.support || user.verified)
              }

              private fun noteTalked(account: Int, dialogId: Long) {
                  val st = state(account)
                  if (st.talked.size >= TALKED_LIMIT) st.talked.clear()
                  if (st.talked.add(dialogId)) persist(account, "talked", st.talked)
              }

              @JvmStatic
              fun onNewMessage(account: Int, message: MessageObject) {
                  if (!isEnabled()) return
                  val dialogId = message.dialogId
                  if (dialogId <= 0) return
                  val st = state(account)
                  if (message.isOut) {
                      noteTalked(account, dialogId)
                      if (st.spam.contains(dialogId)) release(account, dialogId)
                      return
                  }
                  if (st.spam.contains(dialogId) || st.released.contains(dialogId) || st.talked.contains(dialogId)) return
                  if (!isStranger(account, dialogId)) return
                  verifyNeverSpoken(account, dialogId)
              }

              private fun verifyNeverSpoken(account: Int, dialogId: Long) {
                  val st = state(account)
                  if (!st.checking.add(dialogId)) return
                  val storage = MessagesStorage.getInstance(account)
                  storage.storageQueue.postRunnable {
                      var spoken = true
                      try {
                          val cursor = storage.database.queryFinalized("SELECT 1 FROM messages_v2 WHERE uid = $dialogId AND out = 1 LIMIT 1")
                          spoken = cursor.next()
                          cursor.dispose()
                      } catch (_: Throwable) {
                      }
                      AndroidUtilities.runOnUIThread {
                          st.checking.remove(dialogId)
                          if (spoken) noteTalked(account, dialogId) else addSpam(account, dialogId)
                      }
                  }
              }

              private fun addSpam(account: Int, dialogId: Long) {
                  if (!isEnabled()) return
                  val st = state(account)
                  if (st.released.contains(dialogId) || !isStranger(account, dialogId)) return
                  if (!st.spam.add(dialogId)) return
                  persist(account, "spam", st.spam)
                  refresh(account)
              }

              @JvmStatic
              fun release(account: Int, dialogId: Long) {
                  val st = state(account)
                  if (st.released.add(dialogId)) persist(account, "released", st.released)
                  if (st.spam.remove(dialogId)) {
                      persist(account, "spam", st.spam)
                      refresh(account)
                  }
              }

              @JvmStatic
              fun blockAndDelete(account: Int, dialogId: Long) {
                  val controller = MessagesController.getInstance(account)
                  controller.blockPeer(dialogId)
                  controller.deleteDialog(dialogId, 0, true)
                  val st = state(account)
                  if (st.spam.remove(dialogId)) {
                      persist(account, "spam", st.spam)
                      refresh(account)
                  }
              }

              private fun refresh(account: Int) {
                  val controller = MessagesController.getInstance(account) ?: return
                  controller.sortDialogs(null)
                  val center = NotificationCenter.getInstance(account)
                  center.postNotificationName(NotificationCenter.dialogsNeedReload)
                  center.postNotificationName(NotificationCenter.dialogFiltersUpdated)
                  MessagesStorage.getInstance(account).inu_recalcUnread()
              }

              @JvmStatic
              fun onFeatureChanged() {
                  for (i in 0 until UserConfig.MAX_ACCOUNT_COUNT) {
                      if (UserConfig.getInstance(i).isClientActivated) refresh(i)
                  }
              }

              @JvmStatic
              fun filter(controller: MessagesController, account: Int) {
                  if (!isEnabled() || state(account).spam.isEmpty()) return
                  val pred = { d: TLRPC.Dialog -> contains(account, d.id) }
                  controller.allDialogs.removeAll(pred)
                  for (i in 0 until controller.dialogsByFolder.size()) {
                      controller.dialogsByFolder.valueAt(i)?.removeAll(pred)
                  }
                  for (filter in controller.selectedDialogFilter) {
                      if (filter == null) continue
                      filter.dialogs.removeAll(pred)
                  }
              }

              private fun shouldSilence(account: Int, dialogId: Long): Boolean {
                  if (dialogId <= 0 || !isEnabled()) return false
                  val st = state(account)
                  if (st.spam.contains(dialogId)) return contains(account, dialogId)
                  if (st.released.contains(dialogId) || st.talked.contains(dialogId) || !isStranger(account, dialogId)) return false
                  return MessagesController.getInstance(account).dialogs_dict.get(dialogId) == null
              }

              @JvmStatic
              fun filterNotifications(account: Int, messages: ArrayList<MessageObject>?): ArrayList<MessageObject>? {
                  if (messages == null || messages.isEmpty() || !isEnabled()) return messages
                  val kept = ArrayList<MessageObject>(messages.size)
                  var dropped = false
                  for (message in messages) {
                      if (!message.isOut && shouldSilence(account, message.dialogId)) dropped = true else kept.add(message)
                  }
                  return if (dropped) kept else messages
              }

              @JvmStatic
              fun dialogs(account: Int): ArrayList<TLRPC.Dialog> {
                  val result = ArrayList<TLRPC.Dialog>()
                  if (!isEnabled()) return result
                  val controller = MessagesController.getInstance(account)
                  for (id in state(account).spam) {
                      if (!contains(account, id)) continue
                      controller.dialogs_dict.get(id)?.let { result.add(it) }
                  }
                  result.sortByDescending { it.last_message_date }
                  return result
              }

              @JvmStatic
              fun unreadCount(account: Int): Int {
                  var count = 0
                  for (dialog in dialogs(account)) {
                      if (dialog.unread_count > 0 || dialog.unread_mark) count++
                  }
                  return count
              }

              @JvmStatic
              fun attachSwipe(list: RecyclerView?, account: Int, probe: SelectionProbe?) {
                  if (list == null) return
                  for (i in 0 until list.itemDecorationCount) {
                      if (list.getItemDecorationAt(i) is SpamSwipeController) return
                  }
                  SpamSwipeController.attach(list, account, probe)
              }
          }
          KTEOF
          cat > /tmp/spam-src/SpamSwipeController.kt <<'KTEOF'
          package desu.inugram.helpers.dialogs

          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Typeface
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.VelocityTracker
          import android.view.View
          import android.view.ViewConfiguration
          import androidx.recyclerview.widget.RecyclerView
          import org.telegram.messenger.AndroidUtilities
          import org.telegram.messenger.LocaleController
          import org.telegram.messenger.R
          import org.telegram.ui.ActionBar.Theme
          import org.telegram.ui.Cells.DialogCell
          import org.telegram.ui.Components.CubicBezierInterpolator
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          // entiny: row swipes of the Spam folder. right = take the chat out of Spam, left = block the user and delete the chat for both sides
          class SpamSwipeController private constructor(
              private val list: RecyclerView,
              private val account: Int,
              private val probe: SpamFolderHelper.SelectionProbe?,
          ) : RecyclerView.ItemDecoration(), RecyclerView.OnItemTouchListener {

              private val touchSlop = ViewConfiguration.get(list.context).scaledTouchSlop
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val iconPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  color = Color.WHITE
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER
              }
              private val path = Path()

              private var candidate: DialogCell? = null
              private var downX = 0f
              private var downY = 0f
              private var originX = 0f
              private var nearEdge = false
              private var swiping = false
              private var tracker: VelocityTracker? = null

              private var active: DialogCell? = null
              private var activeDialogId = 0L
              private var armed = false
              private var armProgress = 0f
              private var armAnimator: ValueAnimator? = null
              private var settleAnimator: ValueAnimator? = null

              private val childListener = object : RecyclerView.OnChildAttachStateChangeListener {
                  override fun onChildViewAttachedToWindow(view: View) {}

                  override fun onChildViewDetachedFromWindow(view: View) {
                      if (view !is DialogCell) return
                      if (view === active) abandon()
                      if (view.translationX != 0f) view.translationX = 0f
                      view.swipeCanceled = false
                  }
              }

              private fun dp(value: Float): Int = AndroidUtilities.dp(value)

              override fun onInterceptTouchEvent(rv: RecyclerView, e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          candidate = null
                          if (settleAnimator != null) settleAnimator?.end()
                          if (probe?.active() == true) return false
                          val child = rv.findChildViewUnder(e.x, e.y)
                          if (child is DialogCell && SpamFolderHelper.contains(account, child.dialogId)) {
                              candidate = child
                              downX = e.x
                              downY = e.y
                              nearEdge = e.x < dp(24f)
                              if (!nearEdge) rv.parent?.requestDisallowInterceptTouchEvent(true)
                          }
                          return false
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val cell = candidate ?: return swiping
                          if (swiping) return true
                          val dx = e.x - downX
                          val dy = e.y - downY
                          if (abs(dy) > touchSlop && abs(dy) > abs(dx)) {
                              candidate = null
                              return false
                          }
                          if (abs(dx) > touchSlop && abs(dx) > abs(dy) * 1.2f) {
                              if (dx > 0 && nearEdge) {
                                  candidate = null
                                  return false
                              }
                              begin(cell, e)
                              return true
                          }
                          return false
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> candidate = null
                  }
                  return swiping
              }

              override fun onTouchEvent(rv: RecyclerView, e: MotionEvent) {
                  val cell = active ?: return
                  if (!swiping) return
                  tracker?.addMovement(e)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_MOVE -> move(cell, e.x - originX)
                      MotionEvent.ACTION_UP -> finish(cell, false)
                      MotionEvent.ACTION_CANCEL -> finish(cell, true)
                  }
              }

              override fun onRequestDisallowInterceptTouchEvent(disallowIntercept: Boolean) {}

              private fun begin(cell: DialogCell, e: MotionEvent) {
                  settleAnimator?.cancel()
                  armAnimator?.cancel()
                  swiping = true
                  active = cell
                  activeDialogId = cell.dialogId
                  armed = false
                  armProgress = 0f
                  originX = e.x
                  cell.swipeCanceled = true
                  cell.isPressed = false
                  tracker?.recycle()
                  tracker = VelocityTracker.obtain().also { it.addMovement(e) }
                  list.parent?.requestDisallowInterceptTouchEvent(true)
              }

              private fun threshold(cell: View): Float = max(dp(88f).toFloat(), cell.width * 0.3f)

              private fun move(cell: DialogCell, dx: Float) {
                  val width = cell.width.toFloat()
                  val translation = min(max(dx, -width), width)
                  cell.translationX = translation
                  val nowArmed = abs(translation) >= threshold(cell)
                  if (nowArmed != armed) {
                      armed = nowArmed
                      animateArm(if (armed) 1f else 0f)
                      if (armed) tick()
                  }
                  list.invalidate()
              }

              private fun tick() {
                  try {
                      list.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP, HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING)
                  } catch (_: Exception) {
                  }
              }

              private fun animateArm(target: Float) {
                  armAnimator?.cancel()
                  val animator = ValueAnimator.ofFloat(armProgress, target)
                  animator.duration = 220
                  animator.interpolator = CubicBezierInterpolator.EASE_OUT_QUINT
                  animator.addUpdateListener {
                      armProgress = it.animatedValue as Float
                      list.invalidate()
                  }
                  armAnimator = animator
                  animator.start()
              }

              private fun finish(cell: DialogCell, cancelled: Boolean) {
                  var velocity = 0f
                  tracker?.let {
                      it.computeCurrentVelocity(1000)
                      velocity = it.xVelocity
                      it.recycle()
                  }
                  tracker = null
                  swiping = false
                  val translation = cell.translationX
                  val direction = if (translation >= 0f) 1 else -1
                  val flung = abs(velocity) > dp(900f) && (velocity > 0f) == (translation > 0f) && abs(translation) > dp(48f)
                  if (!cancelled && (armed || flung)) {
                      if (!armed) {
                          armed = true
                          animateArm(1f)
                          tick()
                      }
                      complete(cell, direction)
                  } else {
                      snapBack(cell)
                  }
              }

              private fun complete(cell: DialogCell, direction: Int) {
                  val dialogId = activeDialogId
                  val animator = ValueAnimator.ofFloat(cell.translationX, direction * cell.width.toFloat())
                  animator.duration = 200
                  animator.interpolator = CubicBezierInterpolator.EASE_OUT_QUINT
                  animator.addUpdateListener {
                      cell.translationX = it.animatedValue as Float
                      list.invalidate()
                  }
                  animator.addListener(object : AnimatorListenerAdapter() {
                      private var cancelled = false

                      override fun onAnimationCancel(animation: Animator) {
                          cancelled = true
                      }

                      override fun onAnimationEnd(animation: Animator) {
                          if (settleAnimator === animator) settleAnimator = null
                          if (cancelled) return
                          if (direction > 0) SpamFolderHelper.release(account, dialogId) else SpamFolderHelper.blockAndDelete(account, dialogId)
                          AndroidUtilities.runOnUIThread({ clearActive(cell) }, 350)
                      }
                  })
                  settleAnimator = animator
                  animator.start()
              }

              private fun snapBack(cell: DialogCell) {
                  animateArm(0f)
                  val animator = ValueAnimator.ofFloat(cell.translationX, 0f)
                  animator.duration = 240
                  animator.interpolator = CubicBezierInterpolator.EASE_OUT_QUINT
                  animator.addUpdateListener {
                      cell.translationX = it.animatedValue as Float
                      list.invalidate()
                  }
                  animator.addListener(object : AnimatorListenerAdapter() {
                      override fun onAnimationEnd(animation: Animator) {
                          if (settleAnimator === animator) settleAnimator = null
                          clearActive(cell)
                      }
                  })
                  settleAnimator = animator
                  animator.start()
              }

              private fun clearActive(cell: DialogCell) {
                  if (active !== cell) return
                  active = null
                  armed = false
                  armProgress = 0f
                  cell.swipeCanceled = false
                  list.invalidate()
              }

              private fun abandon() {
                  settleAnimator?.cancel()
                  armAnimator?.cancel()
                  settleAnimator = null
                  swiping = false
                  tracker?.recycle()
                  tracker = null
                  active = null
                  armed = false
                  armProgress = 0f
                  list.invalidate()
              }

              override fun onDraw(c: Canvas, parent: RecyclerView, state: RecyclerView.State) {
                  val cell = active ?: return
                  val shift = cell.translationX
                  if (shift == 0f || cell.parent !== parent) return
                  val restore = shift > 0f
                  val top = cell.top + cell.translationY
                  val bottom = cell.bottom + cell.translationY
                  val left = if (restore) cell.left.toFloat() else cell.right + shift
                  val right = if (restore) cell.left + shift else cell.right.toFloat()
                  val revealWidth = right - left
                  if (revealWidth <= 0f) return

                  val accent = if (restore) RESTORE_COLOR else BLOCK_COLOR
                  val idle = if (Theme.isCurrentThemeDark()) 0xFF4A4F57.toInt() else 0xFFA9ADB3.toInt()
                  val anchor = dp(44f).toFloat()
                  val cx = if (restore) cell.left + anchor else cell.right - anchor
                  val cy = (top + bottom) / 2f

                  c.save()
                  c.clipRect(left, top, right, bottom)
                  paint.style = Paint.Style.FILL
                  paint.color = idle
                  c.drawRect(left, top, right, bottom, paint)
                  if (armProgress > 0f) {
                      val reach = hypot(max(abs(cx - left), abs(right - cx)), (bottom - top) / 2f)
                      paint.color = accent
                      c.drawCircle(cx, cy, reach * armProgress, paint)
                  }

                  val visibility = ((revealWidth - dp(16f)) / dp(40f)).coerceIn(0f, 1f)
                  if (visibility > 0f) {
                      val scale = (0.7f + 0.3f * visibility) * (1f + 0.12f * sin(Math.PI * armProgress).toFloat())
                      val alpha = (255 * visibility).toInt()
                      c.save()
                      c.translate(cx, cy - dp(8f))
                      c.scale(scale, scale)
                      iconPaint.alpha = alpha
                      iconPaint.strokeWidth = dp(2.2f).toFloat()
                      if (restore) drawRestoreIcon(c) else drawBlockIcon(c)
                      c.restore()
                      textPaint.alpha = alpha
                      textPaint.textSize = dp(12f).toFloat()
                      val label = LocaleController.getString(if (restore) R.string.InuSpamRestore else R.string.InuSpamBlock)
                      c.drawText(label, cx, cy + dp(24f), textPaint)
                  }
                  c.restore()
              }

              private fun drawRestoreIcon(c: Canvas) {
                  val u = dp(1f).toFloat()
                  path.reset()
                  path.moveTo(-10 * u, 2 * u)
                  path.lineTo(-10 * u, 9 * u)
                  path.lineTo(10 * u, 9 * u)
                  path.lineTo(10 * u, 2 * u)
                  path.moveTo(0f, 5 * u)
                  path.lineTo(0f, -9 * u)
                  path.moveTo(-5 * u, -4 * u)
                  path.lineTo(0f, -9 * u)
                  path.lineTo(5 * u, -4 * u)
                  c.drawPath(path, iconPaint)
              }

              private fun drawBlockIcon(c: Canvas) {
                  val u = dp(1f).toFloat()
                  c.drawCircle(0f, 0f, 10 * u, iconPaint)
                  c.drawLine(-7 * u, -7 * u, 7 * u, 7 * u, iconPaint)
              }

              companion object {
                  private const val RESTORE_COLOR = 0xFF34C759.toInt()
                  private const val BLOCK_COLOR = 0xFFFF3B30.toInt()

                  @JvmStatic
                  fun attach(list: RecyclerView, account: Int, probe: SpamFolderHelper.SelectionProbe?) {
                      val controller = SpamSwipeController(list, account, probe)
                      list.addItemDecoration(controller)
                      list.addOnItemTouchListener(controller)
                      list.addOnChildAttachStateChangeListener(controller.childListener)
                  }
              }
          }
          KTEOF
          cat > /tmp/spam-src/SpamPill.kt <<'KTEOF'
          package desu.inugram.helpers.pillstack.pills

          import android.annotation.SuppressLint
          import android.content.Context
          import desu.inugram.helpers.dialogs.SpamFolderHelper
          import desu.inugram.helpers.pillstack.PillType
          import desu.inugram.ui.SpamActivity
          import org.telegram.messenger.LocaleController
          import org.telegram.messenger.NotificationCenter
          import org.telegram.messenger.R
          import org.telegram.messenger.UserConfig
          import org.telegram.ui.ActionBar.Theme
          import org.telegram.ui.LaunchActivity

          // entiny: stranger chats live behind this pill; the number is how many of them are unread
          @SuppressLint("ViewConstructor")
          class SpamPill(context: Context, resourcesProvider: Theme.ResourcesProvider?) :
              BasePill(context, resourcesProvider), NotificationCenter.NotificationCenterDelegate {

              private var lastAccount = 0
              private var unread = 0

              init {
                  setupPill(R.drawable.msg_report, startPaddingDp = 8f, endPaddingDp = 10f, iconGapDp = 4f)
                  onUpdateData(false)
              }

              override fun getPillId(): Int = PillType.SPAM.id

              override fun getRefreshInterval(): Long = 0

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  lastAccount = UserConfig.selectedAccount
                  val center = NotificationCenter.getInstance(lastAccount)
                  center.addObserver(this, NotificationCenter.dialogsNeedReload)
                  center.addObserver(this, NotificationCenter.updateInterfaces)
                  center.addObserver(this, NotificationCenter.dialogsUnreadCounterChanged)
                  onUpdateData(true)
              }

              override fun onDetachedFromWindow() {
                  super.onDetachedFromWindow()
                  val center = NotificationCenter.getInstance(lastAccount)
                  center.removeObserver(this, NotificationCenter.dialogsNeedReload)
                  center.removeObserver(this, NotificationCenter.updateInterfaces)
                  center.removeObserver(this, NotificationCenter.dialogsUnreadCounterChanged)
              }

              override fun didReceivedNotification(id: Int, account: Int, vararg args: Any?) {
                  if (account != lastAccount) return
                  if (id == NotificationCenter.dialogsNeedReload || id == NotificationCenter.updateInterfaces || id == NotificationCenter.dialogsUnreadCounterChanged) {
                      onUpdateData(false)
                  }
              }

              override fun onUpdateData(force: Boolean) {
                  val count = SpamFolderHelper.unreadCount(UserConfig.selectedAccount)
                  val title = LocaleController.getString(R.string.InuPillStackSpam)
                  val text = if (count > 0) "$title $count" else title
                  if (force || count != unread || textView.text?.toString() != text) {
                      if (count != unread) animateSizeChange()
                      unread = count
                      textView.setText(text, force)
                  }
                  updateColors()
              }

              override fun onPillClicked() {
                  LaunchActivity.getSafeLastFragment()?.presentFragment(SpamActivity())
              }

              override fun onPillLongClicked(): Boolean = showPillMenu {
                  add(R.drawable.msg_report, LocaleController.getString(R.string.InuSpamTitle)) { onPillClicked() }
                  addSettingsEntry()
              }

              override fun updateColors() = applyPillColors(if (unread > 0) getThemedColor(Theme.key_text_RedRegular) else defaultAccent())
          }
