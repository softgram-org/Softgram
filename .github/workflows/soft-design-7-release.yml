name: Softgram Release

# One-time: uploading this file applies the changes (it runs by itself).
# Every release: Actions -> "Softgram Release" -> Run workflow. The bot asks you for the
# version, the release number and the What's new text, then builds and publishes.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'release = ask the bot questions, build and publish.  patch = only re-apply the code changes'
        required: false
        default: release
        type: choice
        options:
          - release
          - patch
      mode:
        description: 'release = GitHub release + CI channel.  release+tg = also the main Telegram channel'
        required: false
        default: release+tg
        type: choice
        options:
          - release
          - release+tg
      prerelease:
        description: 'Mark as a pre-release build'
        required: false
        default: false
        type: boolean
      build_arm7:
        description: 'Also build an armeabi-v7a (32-bit) APK'
        required: false
        default: false
        type: boolean
      build_plugins:
        description: 'Also build an arm64 APK with plugins'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/soft-design-7-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: ${{ github.event_name == 'push' || inputs.task == 'patch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: softgram-chain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Apply changes
        run: |
          cat > /tmp/step.py <<'PYEOF'
          import os, re, sys, base64


          def rd(p):
              with open(p, encoding="utf-8", newline="") as f:
                  return f.read()


          def wr(p, s):
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(s)


          def die(msg):
              print("ERROR: " + msg)
              sys.exit(1)


          def need(p):
              if not os.path.isfile(p):
                  die("missing file " + p)


          def rep(p, old, new):
              need(p)
              s = rd(p)
              if old not in s:
                  die("anchor not found in %s: %r" % (p, old[:100]))
              wr(p, s.replace(old, new, 1))


          if not os.path.isdir("src/res") or not os.path.isfile("series"):
              die("run from the repository root")
          if os.path.exists(".softgram/7-defaults-release.done"):
              print("Already applied.")
              sys.exit(0)

          DEFAULTS_B64 = ""

          KOTLIN_DEFAULTS = r'''package desu.inugram.helpers

          import android.content.Context
          import androidx.core.content.edit
          import desu.inugram.helpers.cloud.CloudSettingsHelper
          import desu.inugram.helpers.cloud.SettingsBackupHelper
          import org.telegram.messenger.R

          // softgram: factory defaults come from the bundled softgram_defaults.json (same format as a settings export)
          object SoftgramDefaults {
              private const val SEED_PREFS = "softgram_seed"
              private const val SEED_DONE = "defaults_v1"
              private const val SEED_PENDING = "defaults_v1_pending"

              // true only on a clean install, before any setting has been written
              @JvmStatic
              fun isFreshInstall(context: Context): Boolean {
                  val seed = context.getSharedPreferences(SEED_PREFS, Context.MODE_PRIVATE)
                  if (seed.getBoolean(SEED_DONE, false)) return false
                  if (seed.getBoolean(SEED_PENDING, false)) return true
                  val fresh = context.getSharedPreferences("inugram", Context.MODE_PRIVATE).all.isEmpty()
                  if (fresh) seed.edit { putBoolean(SEED_PENDING, true) }
                  return fresh
              }

              @JvmStatic
              fun seed(context: Context) {
                  try {
                      if (applyBundled(context)) {
                          context.getSharedPreferences(SEED_PREFS, Context.MODE_PRIVATE).edit {
                              putBoolean(SEED_DONE, true)
                              remove(SEED_PENDING)
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              @JvmStatic
              fun applyBundled(context: Context): Boolean {
                  val json = context.resources.openRawResource(R.raw.softgram_defaults).bufferedReader(Charsets.UTF_8).use { it.readText() }
                  val parsed = SettingsBackupHelper.parse(json) as? SettingsBackupHelper.ParseResult.Ok ?: return false
                  SettingsBackupHelper.apply(parsed)
                  return true
              }

              // "reset to defaults" goes back to the Softgram defaults, not to the stock code defaults
              @JvmStatic
              fun reapplyAfterReset(context: Context) {
                  if (CloudSettingsHelper.restoring) return
                  try {
                      applyBundled(context)
                  } catch (_: Throwable) {
                  }
              }
          }
          '''

          POST_TS = r'''/** Softgram post: title, channel, files, then the owner's own What's new text in a collapsed block. */
          export function softPost(info: PostInfo, lines: string[], apks: RichApk[]): string {
            const items = lines.map(l => `- ${mdEsc(l)}`).join('\n')
            return [richTitle(info), '@Softgram_org', richFiles(apks), `<details><summary>What's new</summary>\n\n${items}\n\n</details>`].filter(Boolean).join('\n\n')
          }
          '''

          SEND_TS_FUNCS = r'''interface SoftPost { createdAt: number, base: string, label: string, lines: string[] }
          const softPath = resolve('assets/release/softgram-post.json')
          const soft: SoftPost | null = await fs.readFile(softPath, 'utf8')
            .then(text => JSON.parse(text) as SoftPost)
            .then(p => (Date.now() - p.createdAt < 36 * 3600 * 1000 && p.lines?.length ? p : null))
            .catch(() => null)
          const softRequired = true

          function git(...args: string[]) {
            return new Promise<void>((res, rej) => {
              const p = spawn('git', args, { stdio: 'inherit' })
              p.on('error', rej)
              p.on('exit', code => (code === 0 ? res() : rej(new Error(`git ${args[0]} exited ${code}`))))
            })
          }

          async function consumeSoftPost() {
            try {
              await git('config', 'user.name', 'github-actions[bot]')
              await git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              await git('rm', '-q', '-f', 'assets/release/softgram-post.json')
              await git('commit', '-q', '-m', 'Softgram: release post published')
              await git('pull', '--rebase', '-q')
              await git('push', '-q')
            } catch (e) {
              console.warn('could not remove the used post file:', e)
            }
          }

          async function publishSoft(files: string[]) {
            const s = soft!
            const post: PostInfo = { base: s.base, label: s.label, track: info.track, repo: info.repo }
            const apks = richApks(files)
            const attachments: Record<string, InputRichMessageMedia> = {}
            for (const apk of apks) {
              // @ts-expect-error mtcute 0.31 omits document inputs from its rich-media type
              attachments[apk.id] = InputMedia.document(`file:${join(outDir, apk.file)}`, { fileName: apk.file, fileMime: APK_MIME })
            }
            const uploadCache: RichMediaUploadCache = new Map()
            const content = { type: 'markdown' as const, content: softPost(post, s.lines, apks), attachments }
            await tg.sendRichMessage(channelCI, { content, uploadCache })
            if (ciOnly || info.track === 'beta') {
              console.log('CI channel only: skipping the main channel post.')
            } else {
              await tg.sendRichMessage(channelMain, { content, uploadCache })
            }
            await consumeSoftPost()
          }

          '''

          # ---- 1. factory defaults: bundled settings file + loader
          wr("src/res/raw/softgram_defaults.json", base64.b64decode(DEFAULTS_B64).decode("utf-8"))
          wr("src/fork/helpers/SoftgramDefaults.kt", KOTLIN_DEFAULTS)

          HOOKS = "src/fork/InuHooks.kt"
          rep(HOOKS, "        InuConfig.load(context)\n",
              "        val softFresh = desu.inugram.helpers.SoftgramDefaults.isFreshInstall(context)\n"
              "        InuConfig.load(context)\n"
              "        if (softFresh) desu.inugram.helpers.SoftgramDefaults.seed(context)\n")

          BK = "src/fork/helpers/cloud/SettingsBackupHelper.kt"
          rep(BK, "        return toRemove.size + stockReset\n",
              "        org.telegram.messenger.ApplicationLoader.applicationContext?.let { desu.inugram.helpers.SoftgramDefaults.reapplyAfterReset(it) }\n"
              "        return toRemove.size + stockReset\n")

          # ---- 2. exported settings file name
          rep(BK, 'const val FILENAME_SUFFIX = ".entiny-settings.json"', 'const val FILENAME_SUFFIX = "Softgram-settings.json"')
          rep("src/fork/ui/settings/BackupSettingsActivity.kt",
              '            val date = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())\n'
              '            val file = File(AndroidUtilities.getCacheDir(), "$date${SettingsBackupHelper.FILENAME_SUFFIX}")\n',
              '            val file = File(AndroidUtilities.getCacheDir(), SettingsBackupHelper.FILENAME_SUFFIX)\n')
          CH = "src/fork/helpers/chat/ChatHelper.kt"
          rep(CH, "        name.endsWith(SettingsBackupHelper.FILENAME_SUFFIX) ||\n",
              '        name.endsWith(SettingsBackupHelper.FILENAME_SUFFIX) || name.endsWith(".entiny-settings.json") ||\n')
          rep(CH, "        val isSettings = name.endsWith(SettingsBackupHelper.FILENAME_SUFFIX)\n",
              '        val isSettings = name.endsWith(SettingsBackupHelper.FILENAME_SUFFIX) || name.endsWith(".entiny-settings.json")\n')

          # ---- 3. Telegram release post: english only, text comes from the owner
          P = "assets/release/post.ts"
          need(P)
          if "export function softPost" not in rd(P):
              wr(P, rd(P).rstrip("\n") + "\n\n" + POST_TS)

          S = "assets/release/send.ts"
          rep(S, "import { fitCaption, mainPost, noteLines, richApks, richCiPost, richMainPost, richSections, type PostInfo } from './post'",
              "import { fitCaption, mainPost, noteLines, richApks, richCiPost, richMainPost, richSections, softPost, type PostInfo } from './post'")
          rep(S, "try {\n  const post: PostInfo = {", SEND_TS_FUNCS + "try {\n  const post: PostInfo = {")
          rep(S, "  if (richMode) {\n    await publishRich(post, files)\n  } else {",
              "  if (soft) {\n    await publishSoft(files)\n  } else if (softRequired) {\n"
              "    console.error('No fresh What\\'s new text found. Start the build from the \"Softgram Release\" workflow so the bot can ask for it. Nothing was posted.')\n"
              "    process.exitCode = 1\n"
              "  } else if (richMode) {\n    await publishRich(post, files)\n  } else {")

          os.makedirs(".softgram", exist_ok=True)
          wr(".softgram/7-defaults-release.done", "defaults and release flow applied\n")
          print("OK: defaults, file name and release flow applied")
          PYEOF
          python3 /tmp/step.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Softgram: default settings, settings file name, release flow"
            git pull --rebase -q
            git push
          fi

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task != 'patch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    concurrency:
      group: softgram-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check that the release flow is applied
        run: |
          if [ ! -f .softgram/7-defaults-release.done ]; then
            echo "The release flow is not applied yet. Run this workflow once with task = patch."
            exit 1
          fi

      - name: Ask for version, release number and What's new
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
          OWNER_ID: '8754725830'
        run: |
          cat > /tmp/ask.py <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.error, urllib.request

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          OWNER = int(os.environ.get("OWNER_ID", "8754725830"))
          PRERELEASE = os.environ.get("PRERELEASE", "false") == "true"
          DEADLINE = time.time() + int(os.environ.get("ASK_TIMEOUT_MIN", "170")) * 60
          if not TOKEN:
              print("ERROR: secret TELEGRAM_BOT_TOKEN is not set")
              sys.exit(1)


          def api(method, payload, timeout=30):
              req = urllib.request.Request(
                  "https://api.telegram.org/bot%s/%s" % (TOKEN, method),
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read().decode("utf-8"))
                  except Exception:
                      return {"ok": False, "description": "HTTP %s" % e.code}
              except Exception as e:
                  return {"ok": False, "description": type(e).__name__}


          def say(text):
              r = api("sendMessage", {"chat_id": OWNER, "text": text, "disable_web_page_preview": True})
              if not r.get("ok"):
                  print("ERROR: cannot message the owner: %s" % r.get("description"))
                  print("Open the bot in Telegram, press Start, then run this workflow again.")
                  sys.exit(1)


          # skip anything that was sent before this run started
          offset = 0
          r = api("getUpdates", {"offset": -1, "timeout": 0})
          if not r.get("ok") and "webhook" in str(r.get("description", "")).lower():
              api("deleteWebhook", {"drop_pending_updates": False})
              r = api("getUpdates", {"offset": -1, "timeout": 0})
          if r.get("ok") and r.get("result"):
              offset = r["result"][-1]["update_id"] + 1


          def wait_text():
              global offset
              while time.time() < DEADLINE:
                  r = api("getUpdates", {"offset": offset, "timeout": 50, "allowed_updates": ["message"]}, timeout=70)
                  if not r.get("ok"):
                      time.sleep(5)
                      continue
                  for u in r["result"]:
                      offset = u["update_id"] + 1
                      m = u.get("message") or {}
                      if (m.get("from") or {}).get("id") != OWNER or (m.get("chat") or {}).get("id") != OWNER:
                          continue
                      t = (m.get("text") or "").strip()
                      if not t:
                          continue
                      if t.lower().startswith("/cancel"):
                          say("Cancelled. Nothing was built or published.")
                          print("Cancelled by the owner.")
                          sys.exit(1)
                      return t
              print("ERROR: no answer before the deadline")
              sys.exit(1)


          def ask(question, pattern, hint):
              say(question)
              while True:
                  t = wait_text()
                  if re.fullmatch(pattern, t):
                      return t
                  say(hint)


          say("Softgram release is starting. Send /cancel at any time to stop.")
          version = ask("Which version? Send only the number, like 13.2.2", r"\d+(\.\d+){1,3}", "Send only the version, like 13.2.2")
          number = ask("Which release number? Send only the number, like 1", r"\d+", "Send only the number, like 1")
          say("Now send the What's new text in ONE message. One change per line. It goes into the What's new drawer exactly as you send it.")

          lines = []
          while not lines:
              raw = wait_text()
              for ln in raw.splitlines():
                  ln = re.sub(r"^\s*(?:[-*\u2022\u2013\u2014]+\s+)", "", ln).strip()
                  if ln:
                      lines.append(ln)
              if not lines:
                  say("That was empty. Send the What's new text again.")

          label = ("pre-release " if PRERELEASE else "release ") + number
          post = {"createdAt": int(time.time() * 1000), "base": version, "label": label, "lines": lines}
          os.makedirs("assets/release", exist_ok=True)
          with open("assets/release/softgram-post.json", "w", encoding="utf-8") as f:
              json.dump(post, f, ensure_ascii=False, indent=2)
              f.write("\n")
          say("Saved. Building Softgram %s \u00b7 %s now, and I will publish it when the build is ready." % (version, label))
          print("OK: Softgram %s - %s, %d lines" % (version, label, len(lines)))
          PYEOF
          python3 /tmp/ask.py

      - name: Save the text and start the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/release/softgram-post.json
          git commit -m "Softgram: release post text"
          git pull --rebase -q
          git push
          gh workflow run apk.yml --ref "${{ github.ref_name }}" \
            -f mode="${{ inputs.mode }}" \
            -f prerelease="${{ inputs.prerelease }}" \
            -f build_arm7="${{ inputs.build_arm7 }}" \
            -f build_plugins="${{ inputs.build_plugins }}"
