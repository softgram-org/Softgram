          python3 - <<'SDPY'
          #!/usr/bin/env python3
          """Soft Design 6: share/send planes, README cleanup, fa texts, proxy notice, language fallback."""
          import os, re, sys, base64, glob

          ROOT = os.getcwd()
          FAILS = []
          def P(p): return os.path.join(ROOT, p)
          def rd(p): return open(P(p), encoding='utf-8').read()
          def wr(p, s):
              os.makedirs(os.path.dirname(P(p)), exist_ok=True)
              open(P(p), 'w', encoding='utf-8').write(s)

          def edit(p, pairs):
              if not os.path.exists(P(p)):
                  FAILS.append(('missing file', p)); print('WARN missing', p); return
              s = rd(p); o = s
              for old, new in pairs:
                  if new in s and old not in s: continue
                  if old not in s:
                      FAILS.append((p, old[:60])); print('WARN no match in', p, ':', old[:70].replace('\n', '\\n')); continue
                  s = s.replace(old, new)
              if s != o: wr(p, s); print('edited', p)

          BG = "M105,75 L87,92 L64,118 L48,141 L31,172 L18,204 L10,233 L7,253 L5,259 L3,284 L1,290 L1,300 L0,301 L0,960 L3,972 L4,988 L5,989 L5,995 L9,1016 L17,1046 L27,1072 L42,1102 L56,1124 L74,1147 L87,1161 L104,1177 L127,1195 L152,1211 L179,1225 L220,1240 L251,1247 L278,1250 L285,1253 L970,1253 L977,1250 L1003,1247 L1034,1240 L1071,1227 L1094,1216 L1116,1203 L1137,1188 L1156,1172 L1181,1146 L1196,1127 L1212,1102 L1223,1081 L1233,1057 L1242,1028 L1249,994 L1250,979 L1253,969 L1253,285 L1250,274 L1248,252 L1241,220 L1225,176 L1211,149 L1196,126 L1171,96 L1148,74 L1129,59 L1101,41 L1082,31 L1047,17 L1026,12 L1022,10 L990,4 L963,1 L962,0 L290,0 L279,3 L264,4 L263,5 L257,5 L251,7 L236,9 L207,17 L183,26 L162,36 L143,47 L128,57 Z"
          BODY = "M1041,333 L1038,324 L1032,313 L1019,299 L1013,295 L1003,290 L993,287 L988,287 L987,286 L972,286 L971,287 L960,288 L813,337 L810,337 L758,355 L755,355 L706,372 L703,372 L651,390 L648,390 L605,405 L602,405 L544,425 L541,425 L507,437 L504,437 L492,442 L489,442 L416,467 L413,467 L395,474 L392,474 L343,491 L340,491 L337,493 L334,493 L274,513 L250,524 L236,534 L224,547 L220,554 L220,556 L233,545 L250,539 L260,539 L261,538 L264,538 L265,539 L277,539 L278,540 L284,540 L298,544 L302,544 L339,556 L352,562 L360,564 L374,571 L376,571 L413,589 L415,591 L426,596 L428,598 L453,612 L493,639 L517,657 L552,686 L583,714 L636,766 L702,835 L777,916 L803,941 L818,951 L830,956 L838,957 L839,958 L859,958 L860,957 L864,957 L878,951 L885,946 L893,938 L904,919 L910,901 L912,889 L915,880 L916,871 L918,866 L918,862 L920,857 L920,853 L923,844 L924,835 L926,830 L927,821 L930,812 L932,799 L933,798 L935,786 L939,773 L939,769 L942,760 L942,756 L946,743 L946,739 L947,738 L947,735 L955,706 L955,702 L956,701 L956,698 L957,697 L957,694 L958,693 L958,690 L959,689 L959,686 L960,685 L960,682 L961,681 L978,610 L980,606 L983,591 L985,587 L989,568 L991,564 L996,542 L998,538 L999,531 L1004,516 L1007,501 L1011,490 L1012,483 L1018,465 L1019,458 L1021,454 L1022,447 L1024,443 L1024,440 L1026,436 L1026,433 L1028,429 L1029,422 L1031,418 L1031,415 L1033,411 L1034,404 L1036,400 L1036,397 L1040,384 L1042,368 L1043,367 L1043,342 L1042,341 Z"
          FOLD = "M230,548 L218,561 L215,568 L215,572 L213,575 L213,587 L214,588 L215,597 L218,606 L224,618 L261,667 L270,681 L285,701 L293,714 L303,725 L304,730 L307,733 L311,740 L318,747 L319,752 L333,770 L336,776 L351,797 L352,800 L383,847 L385,852 L392,861 L394,866 L418,902 L421,908 L429,915 L429,919 L431,923 L435,927 L440,927 L443,931 L443,936 L447,940 L452,943 L461,943 L465,947 L466,950 L472,952 L494,953 L511,948 L524,940 L532,933 L540,923 L548,916 L550,913 L550,910 L556,905 L577,873 L637,774 L637,769 L635,766 L603,734 L570,703 L517,658 L467,622 L464,621 L453,613 L433,601 L415,592 L413,590 L360,565 L352,563 L347,560 L331,555 L328,553 L325,553 L322,551 L319,551 L316,549 L313,549 L309,547 L306,547 L302,545 L298,545 L289,542 L278,541 L277,540 L250,540 L240,543 Z"
          NS = 'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"'
          FOLD_ALPHA = '#8CFFFFFF'
          def vec(size, inner):
              return f'<?xml version="1.0" encoding="utf-8"?>\n<vector {NS} android:width="{size}dp" android:height="{size}dp" android:viewportWidth="1254" android:viewportHeight="1254">\n{inner}</vector>\n'
          def group(inner, s, tx, ty):
              return f'<group android:scaleX="{s}" android:scaleY="{s}" android:translateX="{tx}" android:translateY="{ty}">\n{inner}</group>\n'
          MONO = f'<path android:pathData="{BODY}" android:fillColor="#FFFFFFFF"/>\n<path android:pathData="{FOLD}" android:fillColor="{FOLD_ALPHA}"/>\n'

          def drawables():
              d = 'src/res/drawable/'
              wr(d + 'softgram_plane.xml', vec(24, group(MONO, 1.1, -64.35, -57.2)))
              wr(d + 'softgram_send_24.xml', vec(24, group(MONO, 1.2274, -214.4, -93.7)))
              wr(d + 'softgram_send_21.xml', vec(21, group(MONO, 1.509, -321.4, -311.6)))
              print('plane drawables written')

          SVG = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="256" height="256">
          <defs>
          <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="627" y1="0" x2="627" y2="1254"><stop offset="0" stop-color="#0094FF"/><stop offset="1" stop-color="#007AEB"/></linearGradient>
          <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="640" y1="700" x2="400" y2="950"><stop offset="0" stop-color="#84ACE3"/><stop offset="1" stop-color="#E6F1FF"/></linearGradient>
          </defs>
          <path d="{BG}" fill="url(#bg)"/>
          <path d="{BODY}" fill="#FFFFFF"/>
          <path d="{FOLD}" fill="url(#fold)"/>
          </svg>
          '''

          def planes_patch():
              b64 = os.environ.get('PLANES_B64', '').strip()
              if not b64: print('WARN no planes patch'); return
              wr('patches/softgram/send-planes.patch', base64.b64decode(b64).decode('utf-8'))
              s = rd('series')
              if 'softgram/send-planes.patch' not in s:
                  wr('series', s.rstrip('\n') + '\nsoftgram/send-planes.patch\n')
                  print('series updated')
              # fork code: same plane everywhere
              n = 0
              for f in glob.glob(P('src/fork/**/*.kt'), recursive=True):
                  s = open(f, encoding='utf-8').read()
                  t = re.sub(r'R\.drawable\.(?:send_plane_24|send_plane_26|msg_send)\b', 'R.drawable.softgram_send_24', s)
                  t = re.sub(r'R\.drawable\.ic_send\b', 'R.drawable.softgram_send_21', t)
                  if t != s: open(f, 'w', encoding='utf-8').write(t); n += 1
              print('fork files with planes swapped:', n)

          def kotlin():
              S = 'src/fork/ui/settings/'
              # "Support the project": our logo instead of the heart
              edit(S + 'AdditionalSettingsActivity.kt', [
                  ('mkTwoLineEntry(BUTTON_DONATE, R.drawable.entiny_support,', 'mkTwoLineEntry(BUTTON_DONATE, R.drawable.softgram_plane,'),
              ])
              # brand-blue plate for the plane (same edit as Soft Design 5; skipped when already there)
              edit(S + 'SoftIcons.kt', [
                  ('    @JvmStatic\n    fun apply(cell: TextCell, res: Int) {\n        val c = colors(res)\n        cell.setColorfulIcon(c.top, c.bottom, res, true)\n    }',
                   '    private val BRAND_TOP = 0xFF0094FF.toInt()\n    private val BRAND_BOTTOM = 0xFF007AEB.toInt()\n\n'
                   '    private fun top(res: Int): Int = if (res == R.drawable.softgram_plane) BRAND_TOP else colors(res).top\n'
                   '    private fun bottom(res: Int): Int = if (res == R.drawable.softgram_plane) BRAND_BOTTOM else colors(res).bottom\n\n'
                   '    @JvmStatic\n    fun apply(cell: TextCell, res: Int) {\n        cell.setColorfulIcon(top(res), bottom(res), res, true)\n    }'),
                  ('        val c = colors(res)\n        iv.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(c.top, c.bottom)).apply {',
                   '        iv.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(top(res), bottom(res))).apply {'),
              ])
              # proxy page: no experimental banner
              edit(S + 'Schemas.kt', [('        notice(R.string.InuProxyDisclaimer)\n', '')])
              # last-resort string lookup must follow the in-app language, not the phone language
              edit('src/fork/helpers/LocaleHelper.kt', [
                  ('        getLocalString(fallback)?.let { return it }\n        if (res == 0) return null\n        return try {',
                   '        getLocalString(fallback)?.let { return it }\n        if (res == 0) return null\n        resolve(res)?.let { return it }\n        return try {'),
              ])

          FA = {
           'InuArchiveAll': 'همه',
           'InuArchiveDeleteEntry': 'حذف از آرشیو',
           'InuArchiveMediaDeleteSelected': 'فایل‌های انتخاب‌شده حذف شوند؟ از آرشیو هم پاک می‌شوند.',
           'InuArchiveOpenChat': 'باز کردن گفتگو',
           'InuArchiveTitle': 'حذف‌شده و ویرایش‌شده',
           'InuChatMenuEntinyGram': 'Softgram',
           'InuDisguiseName': 'Telegram',
           'InuTypingSpoofAddChat': 'افزودن گفتگو',
           'InuTypingSpoofAddChatInfo': 'یک نفر یا گروه را انتخاب کنید، سپس وضعیتی را که باید نشان داده شود برگزینید',
           'InuTypingSpoofChats': 'گفتگوها',
           'InuTypingSpoofChooseSticker': 'در حال انتخاب استیکر…',
           'InuTypingSpoofEmpty': 'هنوز گفتگویی نیست. یکی اضافه کنید تا وضعیت جعلی در آن نمایش داده شود.',
           'InuTypingSpoofGamePlay': 'در حال بازی…',
           'InuTypingSpoofListInfo': 'برای انتخاب وضعیت روی یک گفتگو بزنید. برای حذف، نگه دارید. وضعیت تا وقتی برنامه باز است فعال می‌ماند.',
           'InuTypingSpoofMode': 'وضعیت',
           'InuTypingSpoofModeInfo': 'وضعیت انتخاب‌شده تا زمانی که خاموشش نکنید به طرف مقابل نشان داده می‌شود.',
           'InuTypingSpoofUploadAudio': 'در حال ارسال صدا…',
           'InuTypingSpoofUploadPhoto': 'در حال ارسال عکس…',
           'InuTypingSpoofUploadRound': 'در حال ارسال پیام ویدیویی…',
           'InuTypingSpoofUploadVideo': 'در حال ارسال ویدیو…',
          }
          TAG_FA = 'از آنِ شما. با طراحی Softgram'

          def strings():
              p = 'src/res/values-fa/strings_inu.xml'
              s = rd(p); o = s
              add = ''
              for k, v in FA.items():
                  if f'name="{k}"' not in s: add += f'    <string name="{k}">{v}</string>\n'
              if add: s = s.replace('</resources>', add + '</resources>')
              s = re.sub(r'(<string name="InuSettingsInfo"[^>]*>)[^<]*(</string>)', lambda m: m.group(1) + TAG_FA + m.group(2), s)
              if s != o: wr(p, s); print('edited', p, '(added', add.count('<string'), 'keys)')

          RULES = [
              (r'https://github\.com/[Ee]ntaytion/[Ee]ntiny[Gg]ram', 'https://github.com/Softingram/Softgram'),
              (r'https://github\.com/[Ee]ntaytion', 'https://github.com/Softingram'),
              (r'(?<![A-Za-z])[Ee]ntiny[Gg]ram', 'Softgram'),
              (r'entinygram', 'softgram'),
              (r'(?<![A-Za-z])[Ee]ntaytion', 'Softgram'),
          ]
          def docs():
              wr('assets/softgram.svg', SVG)
              for old in ('assets/banner.svg', 'assets/logo.svg'):
                  if os.path.exists(P(old)): os.remove(P(old)); print('removed', old)
              files = ['README.md', 'FEATURES.md', 'AGENTS.md'] + [os.path.relpath(f, ROOT) for g in ('docs/**/*.md', 'changelogs/*.md') for f in glob.glob(P(g), recursive=True)]
              for f in files:
                  if not os.path.exists(P(f)): continue
                  s = rd(f); o = s
                  if f == 'README.md':
                      s = re.sub(r'<img src="assets/banner\.svg"[^>]*>', '<img src="assets/softgram.svg" width="160" alt="Softgram" />', s)
                      s = '\n'.join(l for l in s.split('\n') if 'vercel.app' not in l)
                  for pat, rep in RULES: s = re.sub(pat, rep, s)
                  if s != o: wr(f, s); print('cleaned', f)
              # README logo should be centred
              s = rd('README.md')
              if '<p align="center">' not in s:
                  print('WARN README has no centred header')

          if __name__ == '__main__':
              drawables(); planes_patch(); kotlin(); strings(); docs()
              print('--- misses:', len(FAILS))
              for f in FAILS: print('   ', f)
          SDPY

      - name: Sanity check
        run: |
          for f in src/res/drawable/softgram_plane.xml src/res/drawable/softgram_send_24.xml src/res/drawable/softgram_send_21.xml assets/softgram.svg; do
            [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }
            python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$f" || { echo "::error::$f is not valid XML"; exit 1; }
          done
          grep -qx 'softgram/send-planes.patch' series || { echo '::error::planes patch not in series'; exit 1; }
          echo 'all files verified'

      - name: Commit and push
        run: |
          git config user.name  'softgram ci'
          git config user.email 'ci@softgram'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to change (already applied).'
            exit 0
          fi
          git commit -q -m "Soft Design 6: Softgram planes, README cleanup, texts"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Pushed. Now run: Build APK'
