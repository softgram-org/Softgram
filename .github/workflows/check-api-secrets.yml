name: Check API secrets

# Manual run only. Prints which api_id / api_hash the secrets hold (masked), changes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Show masked secrets
        env:
          T_ID: ${{ secrets.TELEGRAM_API_ID }}
          T_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          O_ID: ${{ secrets.API_ID }}
          O_HASH: ${{ secrets.API_HASH }}
        run: |
          show() {
            name="$1"; id="$2"; hash="$3"
            if [ -z "$id" ] && [ -z "$hash" ]; then echo "$name: not set"; return; fi
            echo "$name: id ${id:0:2}***${id: -2} (${#id} digits), hash ends with ${hash: -4} (${#hash} chars)"
            if [ "$id" = "38159064" ]; then echo "  -> this is the ORIGINAL author's api_id, not yours"; fi
          }
          show "TELEGRAM_API_ID / TELEGRAM_API_HASH (used first)" "$T_ID" "$T_HASH"
          show "API_ID / API_HASH (fallback)" "$O_ID" "$O_HASH"
