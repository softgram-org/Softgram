              # send button: Softgram plane instead of the Telegram one
              edit('src/fork/helpers/theme/NonIslandHelper.kt', [
                  ('fun chatSendIcon(): Int = if (chatElements()) R.drawable.ic_send else R.drawable.send_plane_24',
                   'fun chatSendIcon(): Int = if (chatElements()) R.drawable.softgram_send_21 else R.drawable.softgram_send_24'),
              ])
              # drop the "old" app icon and the "old" notification icon
              edit('src/fork/ui/appicons/AppIcons.kt', [
                  ('        ParanoiaHelper.filterLauncherIcons(icons)\n', '        ParanoiaHelper.filterLauncherIcons(icons)\n        icons.removeAll { it == LauncherIcon.OLD }\n'),
              ])
              edit(S + 'NotificationIconCell.kt', [
                  ('            Triple(InuConfig.NotificationIconItem.OLD_ENTINYGRAM, R.drawable.icon_notification_old_inu, R.string.InuNotificationIconOldEntinygram),\n', ''),
              ])
              # no bundled third-party badges ("Official entinyGram channel", "entinyGram developer" ...)
              edit('src/fork/helpers/badges/BadgeRegistry.kt', [
                  ('        return json?.let { parse(it) }.orEmpty()', '        return emptyMap() // softgram: no bundled third-party badges'),
              ])

          def strings():
              d = 'src/res'
              for sub in sorted(os.listdir(P(d))):
                  f = f'{d}/{sub}/strings_inu.xml'
                  if not os.path.exists(P(f)): continue
                  s = rd(f)
                  n = re.sub(r'(<string name="InuMiscPreviewForwardedMessage"[^>]*>[^<]*?)inuGram', r'\1Telegram', s, flags=re.I)
                  if n != s: wr(f, n); print('edited', f)

          # ---------------------------------------------------------------- plugin section: no entinyGram anywhere visible
          BRAND_KT = '''package desu.inugram.helpers.plugins

          // Softgram: third-party plugin metadata may still carry the upstream brand; users only ever see "Softgram"
          object SoftBrand {
              private val RX = Regex("(entiny|inu)[\\\\s_-]*gram", RegexOption.IGNORE_CASE)

              @JvmStatic
              fun clean(text: String?): String? = text?.let { RX.replace(it, "Softgram") }
          }
          '''

          def plugins():
              wr('src/fork/helpers/plugins/SoftBrand.kt', BRAND_KT)
              FQ = 'desu.inugram.helpers.plugins.SoftBrand.clean'
              # authors are shown through SoftBrand.clean (the manifest itself is untouched: the plugin id is derived from it)
              pat = re.compile(r'(?<![\w.])((?:[A-Za-z_]\w*\.)*manifest\.author)\b(?!\s*=[^=])')
              for f in ('PluginRepoPluginActivity', 'PluginsActivity', 'MarketPluginActivity', 'PluginInfoActivity', 'PluginRepoActivity', 'MarketCells', 'MarketActivity'):
                  p = f'src/fork/ui/settings/{f}.kt'
                  if not os.path.exists(P(p)): print('skip', p); continue
                  s = rd(p)
                  if FQ in s: continue
                  n = pat.sub(lambda m: f'{FQ}({m.group(1)})', s)
                  if n != s: wr(p, n); print('authors cleaned in', p)
              # repo titles
              edit('src/fork/helpers/plugins/PluginRepos.kt', [
                  ('class PluginRepo(val channelId: Long, val username: String, val title: String)',
                   'class PluginRepo(val channelId: Long, val username: String, rawTitle: String) {\n    val title: String = desu.inugram.helpers.plugins.SoftBrand.clean(rawTitle).orEmpty()\n}'),
              ])
              R = 'src/fork/ui/settings/PluginReposActivity.kt'
              edit(R, [
                  ('title.text = chat?.title ?: repo.title', 'title.text = desu.inugram.helpers.plugins.SoftBrand.clean(chat?.title) ?: repo.title'),
                  ('        subtitle.text = "@${repo.username}"\n',
                   '        subtitle.text = if (PluginRepos.isOfficial(repo)) "" else "@${repo.username}"\n        subtitle.visibility = if (PluginRepos.isOfficial(repo)) GONE else VISIBLE\n        openChannelAction.visibility = if (PluginRepos.isOfficial(repo)) GONE else VISIBLE\n'),
                  ('        description.text = if (about.isNullOrEmpty()) "" else InuUtils.linkUsernames(about, onUsernameClick)\n        description.visibility = if (about.isNullOrEmpty()) GONE else VISIBLE\n',
                   '        val hideAbout = about.isNullOrEmpty() || PluginRepos.isOfficial(repo)\n        description.text = if (hideAbout) "" else InuUtils.linkUsernames(about, onUsernameClick)\n        description.visibility = if (hideAbout) GONE else VISIBLE\n'),
                  ('        if (chat != null) {\n            avatarDrawable.setInfo(chat)',
                   '        if (PluginRepos.isOfficial(repo)) {\n            avatar.setImageDrawable(context.getDrawable(R.drawable.softgram_logo))\n        } else if (chat != null) {\n            avatarDrawable.setInfo(chat)'),
              ])
              # no "source channel" row that sends users to the upstream channel (official repo only)
              edit('src/fork/ui/settings/PluginRepoPluginActivity.kt', [
                  ('        items.add(mkTwoLineEntry(SOURCE, R.drawable.msg_channel, str(R.string.InuPluginRepoSource), "${repo.title} (@${repo.username})"))\n',
                   '        if (!PluginRepos.isOfficial(repo)) items.add(mkTwoLineEntry(SOURCE, R.drawable.msg_channel, str(R.string.InuPluginRepoSource), "${repo.title} (@${repo.username})"))\n'),
              ])

          def ring_patch():
              b64 = open(P('.sg_ring.b64')).read() if os.path.exists(P('.sg_ring.b64')) else os.environ.get('RING_B64', '')
              if not b64: print('WARN no ring patch'); return
              wr('patches/softgram/ephemeral-ring.patch', base64.b64decode(b64).decode('utf-8'))
              s = rd('series')
              if 'softgram/ephemeral-ring.patch' not in s:
                  wr('series', s.rstrip('\n') + '\nsoftgram/ephemeral-ring.patch\n')
                  print('series updated')

          if __name__ == '__main__':
              logos(); coins(); kotlin(); strings(); plugins(); ring_patch()
              print('--- misses:', len(FAILS))
              for f in FAILS: print('   ', f)
          SDPY

      - name: Sanity check
        run: |
          for f in src/res/drawable/softgram_logo.xml src/res/drawable/softgram_plane.xml src/res/drawable/softgram_send_24.xml src/res/drawable/softgram_send_21.xml src/res/drawable/softgram_polygon.xml src/res/drawable/softgram_hyperliquid.xml src/res/drawable/softgram_dogecoin.xml src/res/launcher/generated/drawable/icon_notification_inu.xml; do
            [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }
            python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$f" || { echo "::error::$f is not valid XML"; exit 1; }
          done
          grep -qx 'softgram/ephemeral-ring.patch' series || { echo '::error::ring patch not in series'; exit 1; }
          echo 'all files verified'

      - name: Commit and push
        run: |
          git config user.name  'softgram ci'
          git config user.email 'ci@softgram'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to change (already applied).'
            exit 0
          fi
          git commit -q -m "Soft Design 5: exact logo everywhere, coin logos, plugin cleanup, ephemeral ring"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Pushed. Now run: Build APK'
