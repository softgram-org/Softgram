          #!/usr/bin/env python3
          """Soft Design 5: exact Softgram logo everywhere, real coin logos, plugin/entinyGram cleanup, ephemeral ring fix."""
          import os, re, sys, base64

          ROOT = os.getcwd()
          FAILS = []

          def P(p): return os.path.join(ROOT, p)
          def rd(p): return open(P(p), encoding='utf-8').read()
          def wr(p, s):
              os.makedirs(os.path.dirname(P(p)), exist_ok=True)
              open(P(p), 'w', encoding='utf-8').write(s)

          def edit(p, pairs, required=False):
              """pairs: (old, new) exact strings. A miss is a warning unless required."""
              if not os.path.exists(P(p)):
                  FAILS.append(('missing file', p)); print('WARN missing', p); return
              s = rd(p); o = s
              for old, new in pairs:
                  if new in s and old not in s:
                      continue  # already applied
                  if old not in s:
                      FAILS.append((p, old[:60])); print('WARN no match in', p, ':', old[:70].replace('\n', '\\n'))
                      continue
                  s = s.replace(old, new)
              if s != o: wr(p, s); print('edited', p)

