          GRAD_BG = '<aapt:attr name="android:fillColor"><gradient android:type="linear" android:startX="627" android:startY="0" android:endX="627" android:endY="1254"><item android:offset="0" android:color="#0094FF"/><item android:offset="1" android:color="#007AEB"/></gradient></aapt:attr>'
          GRAD_FOLD = '<aapt:attr name="android:fillColor"><gradient android:type="linear" android:startX="640" android:startY="700" android:endX="400" android:endY="950"><item android:offset="0" android:color="#84ACE3"/><item android:offset="1" android:color="#E6F1FF"/></gradient></aapt:attr>'
          FOLD_ALPHA = '#8CFFFFFF'   # fold shading for single-colour (tinted) icons: translucent white, so the curve stays visible

          def vec(size, inner, vw=1254):
              return f'<?xml version="1.0" encoding="utf-8"?>\n<vector {NS} android:width="{size}dp" android:height="{size}dp" android:viewportWidth="{vw}" android:viewportHeight="{vw}">\n{inner}</vector>\n'

          def group(inner, s, tx, ty):
              return f'<group android:scaleX="{s}" android:scaleY="{s}" android:translateX="{tx}" android:translateY="{ty}">\n{inner}</group>\n'

          BODY_WHITE = f'<path android:pathData="{BODY}" android:fillColor="#FFFFFF"/>\n'
          FOLD_COLOR = f'<path android:pathData="{FOLD}">{GRAD_FOLD}</path>\n'
          BODY_MONO = f'<path android:pathData="{BODY}" android:fillColor="#FFFFFFFF"/>\n'
          FOLD_MONO = f'<path android:pathData="{FOLD}" android:fillColor="{FOLD_ALPHA}"/>\n'
