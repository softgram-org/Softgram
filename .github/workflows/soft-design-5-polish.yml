          PLATE_SQ = f'<path android:pathData="M0,0H1254V1254H0Z">{GRAD_BG}</path>\n'

          FULL = PLATE + BODY_WHITE + FOLD_COLOR
          MONO = BODY_MONO + FOLD_MONO

          def logos():
              d = 'src/res/drawable/'
              l = 'src/res/launcher/generated/drawable/'
              wr(d + 'softgram_logo.xml', vec(108, FULL))
              wr(d + 'inu_splash_320.xml', vec(320, group(FULL, 0.5, 313.5, 313.5)))
              wr(d + 'inu_splash_old_320.xml', vec(320, group(FULL, 0.5, 313.5, 313.5)))
              wr(d + 'inu_intro_logo.xml', vec(24, group(MONO, 1.1770, -112.8, -105.1)))
              # plate icon used inside settings rows (white plane + shaded fold, on a brand-blue plate)
              wr(d + 'softgram_plane.xml', vec(24, group(MONO, 1.1, -64.35, -57.2)))
              # send button planes (same box as Telegram's own planes)
              wr(d + 'softgram_send_24.xml', vec(24, group(MONO, 1.2274, -214.4, -93.7)))
              wr(d + 'softgram_send_21.xml', vec(21, group(MONO, 1.509, -321.4, -311.6)))
              for n in ('icon_background_inu', 'icon_background_old_inu'):
                  wr(l + n + '.xml', vec(108, PLATE_SQ))
              fg = vec(108, group(BODY_WHITE + FOLD_COLOR, 0.6942, 190.7, 195.2))
              for n in ('icon_foreground_inu', 'icon_foreground_inu_round', 'icon_foreground_old_inu', 'icon_foreground_inu_debug', 'icon_foreground_old_inu_debug'):
                  wr(l + n + '.xml', fg)
              mono108 = vec(108, group(MONO, 0.6942, 190.7, 195.2))
              for n in ('icon_plane_inu', 'icon_plane_old_inu'):
                  wr(l + n + '.xml', mono108)
              mono24 = vec(24, group(MONO, 1.2978, -188.6, -180.2))
              for n in ('icon_notification_inu', 'icon_notification_old_inu', 'icon_settings_inu'):
                  wr(l + n + '.xml', mono24)
              print('logo vectors written')

          # ---------------------------------------------------------------- real coin logos (white glyphs, tinted plates are added by SoftIcons)
          COIN = {
              'softgram_polygon': "m17.82 16.342 5.692-3.287A.98.98 0 0 0 24 12.21V5.635a.98.98 0 0 0-.488-.846l-5.693-3.286a.98.98 0 0 0-.977 0L11.15 4.789a.98.98 0 0 0-.489.846v11.747L6.67 19.686l-3.992-2.304v-4.61l3.992-2.304 2.633 1.52V8.896L7.158 7.658a.98.98 0 0 0-.977 0L.488 10.945a.98.98 0 0 0-.488.846v6.573a.98.98 0 0 0 .488.847l5.693 3.286a.981.981 0 0 0 .977 0l5.692-3.286a.98.98 0 0 0 .489-.846V6.618l.072-.041 3.92-2.263 3.99 2.305v4.609l-3.99 2.304-2.63-1.517v3.092l2.14 1.236a.981.981 0 0 0 .978 0v-.001Z",
              'softgram_hyperliquid': "M21 11.937a9.4 9.4 0 0 1-.901 4.112c-.867 1.863-2.947 3.387-4.846 1.765-1.55-1.322-1.837-4.005-4.157-4.398-3.07-.361-3.145 3.092-5.15 3.482-2.236.44-2.978-3.206-2.945-4.862s.487-3.984 2.43-3.984c2.236 0 2.386 3.283 5.224 3.105 2.81-.186 2.86-3.602 4.696-5.064 1.585-1.264 3.448-.337 4.381 1.184.865 1.406 1.245 3.057 1.265 4.66z",
              'softgram_dogecoin': "M12.288 7.908h-1.715v3.38h2.697v1.415h-2.697v3.38h1.799c.462 0 3.794.052 3.789-3.933-.005-3.984-3.232-4.242-3.873-4.242zM12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm.472 18.481H8.126v-5.778H6.594v-1.415h1.532V5.511h3.73c.882 0 6.727-.183 6.727 6.594-.001 6.888-6.111 6.376-6.111 6.376z",
          }
          def coins():
              for name, path in COIN.items():
                  wr(f'src/res/drawable/{name}.xml',
                     f'<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n<path android:pathData="{path}" android:fillColor="#FFFFFFFF"/>\n</vector>\n')
              print('coin vectors written')

          # ---------------------------------------------------------------- kotlin edits
          def kotlin():
              S = 'src/fork/ui/settings/'
              # plate colours: Softgram brand gradient for the plane, real colours for the new coins
              edit(S + 'SoftIcons.kt', [
                  ('            R.drawable.entiny_tether to IconBackgroundColors.GREEN,\n',
                   '            R.drawable.entiny_tether to IconBackgroundColors.GREEN,\n'
                   '            R.drawable.softgram_polygon to IconBackgroundColors.PURPLE,\n'
                   '            R.drawable.softgram_hyperliquid to IconBackgroundColors.CYAN,\n'
                   '            R.drawable.softgram_dogecoin to IconBackgroundColors.ORANGE,\n'),
                  ('    @JvmStatic\n    fun apply(cell: TextCell, res: Int) {\n        val c = colors(res)\n        cell.setColorfulIcon(c.top, c.bottom, res, true)\n    }',
                   '    private val BRAND_TOP = 0xFF0094FF.toInt()\n    private val BRAND_BOTTOM = 0xFF007AEB.toInt()\n\n'
                   '    private fun top(res: Int): Int = if (res == R.drawable.softgram_plane) BRAND_TOP else colors(res).top\n'
                   '    private fun bottom(res: Int): Int = if (res == R.drawable.softgram_plane) BRAND_BOTTOM else colors(res).bottom\n\n'
                   '    @JvmStatic\n    fun apply(cell: TextCell, res: Int) {\n        cell.setColorfulIcon(top(res), bottom(res), res, true)\n    }'),
                  ('        val c = colors(res)\n        iv.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(c.top, c.bottom)).apply {',
                   '        iv.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(top(res), bottom(res))).apply {'),
              ])
              # donate page: real logos, no footer line (with the heart)
              edit(S + 'DonateActivity.kt', [
                  ('Method(R.drawable.entiny_support, "Polygon · POL"', 'Method(R.drawable.softgram_polygon, "Polygon · POL"'),
                  ('Method(R.drawable.entiny_support, "Hyperliquid · HYPE"', 'Method(R.drawable.softgram_hyperliquid, "Hyperliquid · HYPE"'),
                  ('Method(R.drawable.entiny_support, "Dogecoin · DOGE"', 'Method(R.drawable.softgram_dogecoin, "Dogecoin · DOGE"'),
                  ('        items.add(UItem.asShadow(str(R.string.InuDonateThanks)))\n', '        items.add(UItem.asShadow(null))\n'),
              ])
              # About: channel row gets the Softgram icon
              edit(S + 'AdditionalSettingsActivity.kt', [
                  ('                BUTTON_CHANNEL_LINK,\n                R.drawable.entiny_telegram,', '                BUTTON_CHANNEL_LINK,\n                R.drawable.softgram_plane,'),
